name: App record adapter migration

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/app-record-adapter.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate rendering reads to named record adapter
        run: |
          node <<'NODE'
          const fs=require('fs');

          function replaceExact(source,from,to,label,expected=1){
            const count=source.split(from).length-1;
            if(count!==expected)throw new Error(label+': expected '+expected+', found '+count);
            return source.split(from).join(to);
          }

          let app=fs.readFileSync('js/app.js','utf8');
          app=replaceExact(app,'(function(){\n\nwindow.records = [];','(function(){\n\nvar Record=window.GroovyRecord;\nif(!Record)throw new Error(\'GroovyRecord must load before app.js\');\n\nwindow.records = [];','app Record dependency');

          const cardStart=app.indexOf('function spotifyAlbumLink(record){');
          const cardEnd=app.indexOf('function loadVisibleImages(){',cardStart);
          if(cardStart<0||cardEnd<=cardStart)throw new Error('record rendering block not found');
          let card=app.slice(cardStart,cardEnd);
          const cardReads=[
            ['record[0]','Record.order(record)'],
            ['record[1]','Record.artist(record)'],
            ['record[2]','Record.title(record)'],
            ['record[3]','Record.year(record)'],
            ['record[6]','Record.coverUrl(record)'],
            ['record[11]','Record.pressing(record)'],
            ['record[12]','Record.appleUrl(record)'],
            ['record[13]','Record.shelfId(record)'],
            ['record[14]','Record.shelfSortOrder(record)'],
            ['record[15]','Record.communityRating(record)']
          ];
          cardReads.forEach(function(pair){card=card.split(pair[0]).join(pair[1]);});
          if(/record\[(?:0|1|2|3|6|11|12|13|14|15)\]/.test(card))throw new Error('record rendering block still has migrated tuple reads');
          app=app.slice(0,cardStart)+card+app.slice(cardEnd);

          const wikiStart=app.indexOf('function wikipediaCacheKey(record){');
          const wikiEnd=app.indexOf('async function fetchWikipediaAlbumCandidates',wikiStart);
          if(wikiStart<0||wikiEnd<=wikiStart)throw new Error('Wikipedia identity block not found');
          let wiki=app.slice(wikiStart,wikiEnd);
          wiki=wiki.split('record&&record[1]').join('Record.artist(record)');
          wiki=wiki.split('record&&record[2]').join('Record.title(record)');
          wiki=wiki.split('record&&record[3]').join('Record.year(record)');
          if(/record&&record\[(?:1|2|3)\]/.test(wiki))throw new Error('Wikipedia identity block still has tuple reads');
          app=app.slice(0,wikiStart)+wiki+app.slice(wikiEnd);
          fs.writeFileSync('js/app.js',app);

          let index=fs.readFileSync('index.html','utf8');
          index=replaceExact(index,'/js/app.js?v=125','/js/app.js?v=126','app cache version');
          fs.writeFileSync('index.html',index);

          for(const file of fs.readdirSync('tests').filter(function(name){return name.endsWith('.test.js');})){
            const path='tests/'+file;
            let source=fs.readFileSync(path,'utf8');
            source=source.split('app\\.js\\?v=125').join('app\\.js\\?v=126');
            source=source.split('/js/app.js?v=125').join('/js/app.js?v=126');
            fs.writeFileSync(path,source);
          }

          fs.writeFileSync('tests/record-model.test.js',`const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const test=require('node:test');
          const vm=require('node:vm');
          const root=path.resolve(__dirname,'..');

          function loadModel(){
            const source=fs.readFileSync(path.join(root,'js','record-model.js'),'utf8');
            const context={window:{}};
            vm.runInNewContext(source,context);
            return context.window.GroovyRecord;
          }

          test('record model names legacy tuple fields without changing storage',function(){
            const Record=loadModel();
            const record=[1,'Pink Floyd','The Wall',1979,'Rock',4,'cover.jpg',{},42,99,123,{},'',null,null,4.5,10];
            assert.equal(Record.artist(record),'Pink Floyd');
            assert.equal(Record.title(record),'The Wall');
            assert.equal(Record.albumId(record),42);
            assert.equal(Record.communityRating(record),4.5);
            Record.setRatings(record,5,4.6,11);
            assert.equal(record[5],5);
            assert.equal(record[15],4.6);
            assert.equal(record[16],11);
          });

          test('record model loads before consumers and separated modules use named accessors',function(){
            const html=fs.readFileSync(path.join(root,'index.html'),'utf8');
            const detail=fs.readFileSync(path.join(root,'js','detail-enhancements-v2.js'),'utf8');
            const layout=fs.readFileSync(path.join(root,'js','album-rating-layout-v4.js'),'utf8');
            const modelPosition=html.indexOf('/js/record-model.js?v=1');
            const appPosition=html.indexOf('/js/app.js?v=126');
            assert.ok(modelPosition>=0&&appPosition>modelPosition);
            assert.match(detail,/var Record=window\.GroovyRecord/);
            assert.match(layout,/var Record=window\.GroovyRecord/);
            ['record[1]','record[2]','record[4]','record[5]','record[6]','record[8]','record[9]','record[10]','record[15]','record[16]','current[1]','current[2]','item[8]'].forEach(function(token){assert.equal(detail.includes(token),false,token+' should not remain in detail module');});
            ['record[1]','record[2]','record[5]','record[8]','record[15]','record[16]'].forEach(function(token){assert.equal(layout.includes(token),false,token+' should not remain in rating module');});
          });

          test('app record-card and Wikipedia identity rendering use named record accessors',function(){
            const app=fs.readFileSync(path.join(root,'js','app.js'),'utf8');
            assert.match(app,/var Record=window\.GroovyRecord/);
            const cardStart=app.indexOf('function spotifyAlbumLink(record){');
            const cardEnd=app.indexOf('function loadVisibleImages(){',cardStart);
            const card=app.slice(cardStart,cardEnd);
            ['record[0]','record[1]','record[2]','record[3]','record[6]','record[11]','record[12]','record[13]','record[14]','record[15]'].forEach(function(token){assert.equal(card.includes(token),false,token+' should not remain in card rendering');});
            assert.equal(card.includes('Record.artist(record)'),true);
            assert.equal(card.includes('Record.title(record)'),true);
            assert.equal(card.includes('Record.communityRating(record)'),true);
            const wikiStart=app.indexOf('function wikipediaCacheKey(record){');
            const wikiEnd=app.indexOf('async function fetchWikipediaAlbumCandidates',wikiStart);
            const wiki=app.slice(wikiStart,wikiEnd);
            ['record&&record[1]','record&&record[2]','record&&record[3]'].forEach(function(token){assert.equal(wiki.includes(token),false,token+' should not remain in Wikipedia identity');});
          });
          `);
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/record-model.js
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Commit migration and remove temporary workflow
        run: |
          rm -f .github/workflows/app-record-adapter.yml
          git config user.name "GroovyShelves Maintenance"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No migration changes to commit"; exit 1; }
          git commit -m "Use named record fields in card rendering"
          git push origin notes
