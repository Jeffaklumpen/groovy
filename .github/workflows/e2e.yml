name: Browser smoke tests

on:
  push:
    branches: [notes]
  pull_request:
    branches: [notes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate lockfile for foundation checkpoint
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "GROOVY_LOCKFILE_BEGIN"
          cat package-lock.json
          echo "GROOVY_LOCKFILE_END"
      - name: Install test dependency
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        env:
          GROOVY_E2E_EMAIL: ${{ secrets.GROOVY_E2E_EMAIL }}
          GROOVY_E2E_PASSWORD: ${{ secrets.GROOVY_E2E_PASSWORD }}
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
