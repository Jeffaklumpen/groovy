name: Fix viewed shelf routing

on:
  push:
    branches:
      - notes
    paths:
      - '.github/workflows/fix-viewed-shelf-routing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch viewed shelf load race
        shell: python
        run: |
          from pathlib import Path

          app_path=Path('js/app.js')
          app=app_path.read_text(encoding='utf-8')
          old="""window.loadCollection=async function(){
            var loadVersion=++window.collectionLoadVersion;
            var path=window.location.pathname;

            if(/^\\/(?:user|shelf)\\/[^\\/]+\\/?$/.test(path)){
              return;
            }
          """
          new="""window.loadCollection=async function(){
            var path=window.location.pathname;

            if(/^\\/(?:user|shelf)\\/[^\\/]+\\/?$/.test(path)){
              return;
            }

            var loadVersion=++window.collectionLoadVersion;
          """
          if app.count(old)!=1:
              raise SystemExit(f'Expected exactly one guarded loadCollection block, found {app.count(old)}')
          app=app.replace(old,new,1)
          app_path.write_text(app,encoding='utf-8')

          test_path=Path('tests/route-state.test.js')
          tests=test_path.read_text(encoding='utf-8')
          marker="test('own collection loader cannot invalidate a viewed shelf load'"
          if marker not in tests:
              tests += """

          test('own collection loader cannot invalidate a viewed shelf load',function(){
            const fs=require('node:fs');
            const path=require('node:path');
            const app=fs.readFileSync(path.resolve(__dirname,'..','js','app.js'),'utf8');
            const start=app.indexOf('window.loadCollection=async function(){');
            const end=app.indexOf('function safeExternalUrl',start);
            assert.ok(start>=0&&end>start,'loadCollection block should exist');
            const block=app.slice(start,end);
            const routeGuard=block.indexOf("var path=window.location.pathname;");
            const loadVersion=block.indexOf('var loadVersion=++window.collectionLoadVersion;');
            assert.ok(routeGuard>=0,'route guard should exist');
            assert.ok(loadVersion>routeGuard,'load version must be incremented only after the public shelf route guard');
          });
          """
              test_path.write_text(tests,encoding='utf-8')

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Commit routing fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-viewed-shelf-routing.yml
          git config user.name "GroovyShelves Maintenance"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix viewed shelf loading race"
          git push origin HEAD:notes
