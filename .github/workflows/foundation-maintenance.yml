name: Foundation maintenance

on:
  push:
    branches: [notes]
    paths:
      - '.maintenance/foundation_cleanup.js'
      - '.github/workflows/foundation-maintenance.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply event-driven rating cleanup
        run: node .maintenance/foundation_cleanup.js
      - name: Refresh cache version assertions
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='tests/pwa.test.js';
          let source=fs.readFileSync(path,'utf8');
          const replacements=[
            ['src="\\/js\\/profile\\.js\\?v=9"','src="\\/js\\/profile\\.js\\?v=10"'],
            ['src="\\/js\\/album-rating-layout-v4\\.js\\?v=1"','src="\\/js\\/album-rating-layout-v4\\.js\\?v=2"'],
            ['href="\\/css\\/detail-enhancements\\.css\\?v=7"','href="\\/css\\/detail-enhancements\\.css\\?v=8"'],
            ['src="\\/js\\/detail-enhancements-v2\\.js\\?v=7"','src="\\/js\\/detail-enhancements-v2\\.js\\?v=8"']
          ];
          for(const [from,to] of replacements){
            if(!source.includes(from))throw new Error('Missing stale cache assertion: '+from);
            source=source.replace(from,to);
          }
          fs.writeFileSync(path,source);
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/detail-enhancements-v2.js
          node --check js/album-rating-layout-v4.js
          node --check js/profile.js
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Commit cleanup and remove temporary runner
        run: |
          rm -f .maintenance/foundation_cleanup.js .github/workflows/foundation-maintenance.yml
          rmdir .maintenance 2>/dev/null || true
          git config user.name "GroovyShelves Maintenance"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No cleanup changes to commit"; exit 1; }
          git commit -m "Make album rating updates event-driven"
          git push origin notes
