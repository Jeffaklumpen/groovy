name: Foundation maintenance

on:
  push:
    branches:
      - notes
    paths:
      - '.maintenance/foundation_cleanup.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply matrix cleanup
        run: python .maintenance/foundation_cleanup.py
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Commit cleanup and remove temporary runner
        shell: bash
        run: |
          rm -f .maintenance/foundation_cleanup.py
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/foundation-maintenance.yml
          git config user.name "GroovyShelves Maintenance"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify A-H pressing matrix persistence"
          git push origin HEAD:notes
