name: Marketplace app extraction

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/marketplace-app-extraction.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard verified app blob
        shell: bash
        run: |
          test "$(git hash-object js/app.js)" = "390b47db63f1572f3d1d030e5be68373b7a7c7ad"

      - name: Apply guarded Marketplace extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('js/app.js')
          app=app_path.read_text()

          def replace_once(source,old,new,label):
              count=source.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old,new,1)

          app=replace_once(
              app,
              "var MarketplaceCore=window.GroovyMarketplaceCore;\nvar MarketplaceView=window.GroovyMarketplaceView;\nvar ShelfCore=window.GroovyShelfCore;",
              "var MarketplaceController=window.GroovyMarketplaceController;\nvar ShelfCore=window.GroovyShelfCore;",
              'Marketplace module declarations'
          )
          app=replace_once(
              app,
              "if(!MarketplaceCore)throw new Error('GroovyMarketplaceCore must load before app.js');",
              "if(!MarketplaceController)throw new Error('GroovyMarketplaceController must load before app.js');",
              'Marketplace bootstrap guard'
          )
          app=replace_once(
              app,
              "var ebayEnabled=ebayButton&&ebayButton.getAttribute('data-enabled')==='true';\n",
              "",
              'legacy eBay enabled state'
          )

          legacy_state="""var traderaAlbumIndex=-1;
          var traderaRequestVersion=0;
          var traderaListings=[];
          var traderaListingCache=new Map();
          var ebayAlbumIndex=-1;
          var ebayRequestVersion=0;
          var ebayListings=[];
          var ebayListingCache=new Map();
          var marketplacePriceAlbumIndex=-1;
          var marketplacePriceFinished={tradera:false,ebay:false};
          var marketplacePriceRenderVersion=0;
          var marketplaceFxCache=new Map();
          var MARKETPLACE_CURRENCY_STORAGE_KEY='groovy-marketplace-currency-v1';
          """.replace('          ','')
          app=replace_once(app,legacy_state,'','legacy Marketplace state')
          app=replace_once(app,"if(ebayButton)ebayButton.hidden=!ebayEnabled;\n\n",'', 'legacy eBay visibility binding')

          controller_create="""var marketplaceController=MarketplaceController.create({
            elements:{
              traderaButton:traderaButton,
              traderaButtonLabel:traderaButtonLabel,
              traderaModal:traderaModal,
              closeTraderaModalButton:closeTraderaModalButton,
              traderaModalSubtitle:traderaModalSubtitle,
              traderaListingsStatus:traderaListingsStatus,
              traderaListingsGrid:traderaListingsGrid,
              ebayButton:ebayButton,
              ebayButtonLabel:ebayButtonLabel,
              ebayModal:ebayModal,
              closeEbayModalButton:closeEbayModalButton,
              ebayModalSubtitle:ebayModalSubtitle,
              ebayListingsStatus:ebayListingsStatus,
              ebayListingsGrid:ebayListingsGrid,
              currencySelect:marketplaceCurrencySelect,
              priceSummary:marketplacePriceSummary,
              lowestPriceLink:marketplaceLowestPriceLink,
              lowestPrice:marketplaceLowestPrice,
              lowestMeta:marketplaceLowestMeta,
              priceStatus:marketplacePriceStatus,
              priceNote:marketplacePriceNote
            },
            api:supabaseClient,
            storage:localStorage,
            navigator:navigator,
            Intl:Intl,
            getRecord:function(index){return records[index]||null;},
            getArtist:function(record){return Record.artist(record);},
            getTitle:function(record){return Record.title(record);},
            onLog:function(level,message,error){
              if(level==='error')console.error(message,error||'');
              else if(level==='warn')console.warn(message,error||'');
              else console.log(message,error||'');
            }
          });

          """.replace('          ','')
          app,count=re.subn(
              r"function safeExternalUrl\(value\)\{[\s\S]*?(?=function hasCopyDetails\(details\))",
              controller_create,
              app,
              count=1
          )
          if count!=1:
              raise SystemExit(f'legacy Marketplace function block: expected one replacement, found {count}')

          app=replace_once(
              app,
              "  detailOpenRecordIndex=index;\n  closeTraderaModal();\n  closeEbayModal();\n  resetMarketplacePriceSummary(index);\n  loadTraderaListings(record,index);\n  if(ebayEnabled)loadEbayListings(record,index);\n  copyDetailsRecordKey='';",
              "  detailOpenRecordIndex=index;\n  marketplaceController.openForRecord(index);\n  copyDetailsRecordKey='';",
              'openAlbum Marketplace integration'
          )
          app=replace_once(
              app,
              "  closeTraderaModal();\n  closeEbayModal();\n  traderaRequestVersion++;\n  ebayRequestVersion++;\n  clearMarketplacePriceSummary();",
              "  marketplaceController.close();",
              'closeAlbum Marketplace integration'
          )

          event_pattern=(
              r"syncMarketplaceCurrencyControl\(\);\n"
              r"if\(marketplaceCurrencySelect\)marketplaceCurrencySelect\.addEventListener\('change',[\s\S]*?"
              r"ebayModal\.addEventListener\('click',function\(event\)\{\n"
              r"  if\(event\.target===ebayModal\)closeEbayModal\(\);\n"
              r"\}\);\n\n"
              r"(?=albumOverlay\.onclick=function\(event\)\{)"
          )
          app,count=re.subn(event_pattern,'',app,count=1)
          if count!=1:
              raise SystemExit(f'legacy Marketplace event bindings: expected one replacement, found {count}')

          escape_old="""  if(event.keyCode===27){
              if(ebayModal.classList.contains('visible')){
                closeEbayModal();
                return;
              }
              if(traderaModal.classList.contains('visible')){
                closeTraderaModal();
                return;
              }
              if(albumOverlay.className.indexOf('visible')!==-1){
          """.replace('              ','')
          escape_new="""  if(event.keyCode===27){
              if(marketplaceController.handleEscape())return;
              if(albumOverlay.className.indexOf('visible')!==-1){
          """.replace('              ','')
          app=replace_once(app,escape_old,escape_new,'Escape Marketplace delegation')

          required={
              'Marketplace controller declaration':'var MarketplaceController=window.GroovyMarketplaceController;',
              'Marketplace controller create':'MarketplaceController.create({',
              'open delegation':'marketplaceController.openForRecord(index);',
              'close delegation':'marketplaceController.close();',
              'escape delegation':'marketplaceController.handleEscape()'
          }
          for label,value in required.items():
              if app.count(value)!=1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {app.count(value)}')

          forbidden=[
              'var MarketplaceCore=window.GroovyMarketplaceCore;',
              'var MarketplaceView=window.GroovyMarketplaceView;',
              'function loadTraderaListings',
              'function loadEbayListings',
              'MARKETPLACE_CURRENCY_STORAGE_KEY',
              'traderaRequestVersion',
              'ebayRequestVersion',
              'syncMarketplaceCurrencyControl',
              'resetMarketplacePriceSummary',
              'clearMarketplacePriceSummary',
              'openTraderaModal(',
              'openEbayModal('
          ]
          leftovers=[value for value in forbidden if value in app]
          if leftovers:
              raise SystemExit('Legacy Marketplace symbols remain in app.js: '+', '.join(leftovers))

          if len(app)>=185018:
              raise SystemExit('app.js did not shrink after Marketplace extraction')
          app_path.write_text(app)

          index_path=Path('index.html')
          html=index_path.read_text()
          html=replace_once(html,'/js/app.js?v=147','/js/app.js?v=148','app cache version')
          core=html.index('/js/marketplace-core.js?v=')
          view=html.index('/js/marketplace-view.js?v=')
          controller=html.index('/js/marketplace-controller.js?v=')
          app_pos=html.index('/js/app.js?v=')
          if not (core>=0 and view>core and controller>view and app_pos>controller):
              raise SystemExit('Marketplace script order is invalid')
          index_path.write_text(html)

          view_test_path=Path('tests/marketplace-view.test.js')
          view_test=view_test_path.read_text()
          marker="test('marketplace view loads before app without becoming a bootstrap requirement',()=>{"
          if view_test.count(marker)!=1:
              raise SystemExit('Expected legacy marketplace view architecture test once')
          prefix=view_test.split(marker,1)[0]
          architecture_test="""test('marketplace view stays behind controller and app delegates marketplace orchestration',()=>{
            const root=path.resolve(__dirname,'..');
            const index=fs.readFileSync(path.join(root,'index.html'),'utf8');
            const app=fs.readFileSync(path.join(root,'js','app.js'),'utf8');
            const controllerSource=fs.readFileSync(path.join(root,'js','marketplace-controller.js'),'utf8');
            const coreIndex=index.indexOf('/js/marketplace-core.js');
            const viewIndex=index.indexOf('/js/marketplace-view.js');
            const controllerIndex=index.indexOf('/js/marketplace-controller.js');
            const appIndex=index.indexOf('/js/app.js');
            assert.ok(coreIndex>=0&&viewIndex>coreIndex&&controllerIndex>viewIndex&&appIndex>controllerIndex);
            assert.match(controllerSource,/View\.openListingsModal/);
            assert.match(controllerSource,/View\.applyButtonState/);
            assert.match(app,/var MarketplaceController=window\.GroovyMarketplaceController;/);
            assert.match(app,/MarketplaceController\.create\(\{/);
            assert.doesNotMatch(app,/MarketplaceView\./);
            assert.doesNotMatch(app,/MarketplaceCore\./);
            assert.doesNotMatch(app,/function loadTraderaListings|function loadEbayListings/);
          });
          """.replace('          ','')
          view_test_path.write_text(prefix+architecture_test)

          bootstrap_path=Path('tests/app-bootstrap-order.test.js')
          bootstrap=bootstrap_path.read_text()
          marker="test('Apple search core is passed into the album search feature',()=>{"
          if bootstrap.count(marker)!=1:
              raise SystemExit('Expected Apple search bootstrap marker once')
          if "marketplace controller initializes before app integration" in bootstrap:
              raise SystemExit('Marketplace integration bootstrap test already present')
          integration_test="""test('marketplace controller initializes before app integration',()=>{
            const source=fs.readFileSync('js/app.js','utf8');
            const declaration=source.indexOf('var MarketplaceController=window.GroovyMarketplaceController;');
            const create=source.indexOf('MarketplaceController.create({');
            assert.ok(declaration>=0&&create>declaration);
            assert.match(source,/GroovyMarketplaceController must load before app\.js/);
            assert.doesNotMatch(source,/function loadTraderaListings|function loadEbayListings|MARKETPLACE_CURRENCY_STORAGE_KEY/);
          });

          """.replace('          ','')
          bootstrap=bootstrap.replace(marker,integration_test+marker,1)
          bootstrap_path.write_text(bootstrap)
          PY

      - name: Syntax checks
        run: |
          node --check js/app.js
          node --check js/marketplace-controller.js
          node --check tests/marketplace-controller.test.js
          node --check tests/marketplace-view.test.js
          node --check tests/app-bootstrap-order.test.js

      - name: Run full Node regression suite
        run: node --test tests/*.test.js

      - name: Verify diff scope
        shell: bash
        run: |
          git diff --check
          printf '%s\n' "$(git diff --name-only | sort)" > /tmp/changed.txt
          printf '%s\n' 'index.html' 'js/app.js' 'tests/app-bootstrap-order.test.js' 'tests/marketplace-view.test.js' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          echo "app.js bytes: $(wc -c < js/app.js)"
          git diff --stat

      - name: Commit Marketplace extraction
        shell: bash
        run: |
          git config user.name 'Groovyshelf'
          git config user.email '150244154+Jeffaklumpen@users.noreply.github.com'
          git add index.html js/app.js tests/app-bootstrap-order.test.js tests/marketplace-view.test.js
          git commit -m 'Move marketplace flow into controller'
          git push origin HEAD:notes
