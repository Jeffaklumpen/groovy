name: Marketplace bootstrap step

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/marketplace-bootstrap-step.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded bootstrap edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path=Path('index.html')
          html=index_path.read_text()
          old='<script src="/js/marketplace-view.js?v=1"></script>\n<script src="/js/shelf-core.js?v=2"></script>'
          new='<script src="/js/marketplace-view.js?v=1"></script>\n<script src="/js/marketplace-controller.js?v=1"></script>\n<script src="/js/shelf-core.js?v=2"></script>'
          if html.count(old)!=1:
              raise SystemExit('Expected exactly one Marketplace view/bootstrap boundary')
          if '/js/marketplace-controller.js?v=' in html:
              raise SystemExit('Marketplace controller script already present')
          index_path.write_text(html.replace(old,new,1))

          test_path=Path('tests/app-bootstrap-order.test.js')
          test=test_path.read_text()
          old_list="'/js/rating-core.js?v=','/js/marketplace-core.js?v=','/js/shelf-core.js?v='"
          new_list="'/js/rating-core.js?v=','/js/marketplace-core.js?v=','/js/marketplace-view.js?v=','/js/marketplace-controller.js?v=','/js/shelf-core.js?v='"
          if test.count(old_list)!=1:
              raise SystemExit('Expected bootstrap dependency list boundary once')
          test=test.replace(old_list,new_list,1)
          marker="test('Apple search core is passed into the album search feature',()=>{"
          if test.count(marker)!=1:
              raise SystemExit('Expected Apple search test marker once')
          order_test="""test('marketplace scripts load core, view and controller in order before app.js',()=>{\n  const html=fs.readFileSync('index.html','utf8');\n  const core=html.indexOf('/js/marketplace-core.js?v=');\n  const view=html.indexOf('/js/marketplace-view.js?v=');\n  const controller=html.indexOf('/js/marketplace-controller.js?v=');\n  const app=html.indexOf('/js/app.js?v=');\n  assert.ok(core>=0&&view>core&&controller>view&&app>controller);\n});\n\n"""
          test=test.replace(marker,order_test+marker,1)
          test_path.write_text(test)
          PY

      - name: Run targeted Node tests
        run: node --test tests/marketplace-controller.test.js tests/app-bootstrap-order.test.js

      - name: Check diff
        run: |
          git diff --check
          git diff --exit-code -- js/app.js
          git diff -- index.html tests/app-bootstrap-order.test.js

      - name: Commit bootstrap step
        shell: bash
        run: |
          git config user.name 'Groovyshelf'
          git config user.email '150244154+Jeffaklumpen@users.noreply.github.com'
          git add index.html tests/app-bootstrap-order.test.js
          git commit -m 'Load Marketplace controller before app'
          git push origin HEAD:notes
