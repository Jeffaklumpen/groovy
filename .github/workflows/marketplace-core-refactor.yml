name: Marketplace core refactor checkpoint
on:
  push:
    branches: ["tmp/marketplace-core-refactor"]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: tmp/marketplace-core-refactor
          fetch-depth: 0
      - name: Extract marketplace helpers
        run: python .github/scripts/marketplace-core-refactor.py
      - name: Validate syntax and regression suite
        run: |
          node --check js/marketplace-core.js
          node --check js/app.js
          node --test tests/*.test.js
      - name: Commit stable checkpoint
        run: |
          rm .github/workflows/marketplace-core-refactor.yml
          rm .github/scripts/marketplace-core-refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/marketplace-core.js index.html tests/marketplace-core.test.js tests/app-bootstrap-order.test.js docs/ARCHITECTURE.md .github/workflows/marketplace-core-refactor.yml .github/scripts/marketplace-core-refactor.py
          git commit -m "Extract marketplace core helpers"
          git push origin HEAD:tmp/marketplace-core-refactor
