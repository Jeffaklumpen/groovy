name: Marketplace Node diagnostic

on:
  push:
    branches:
      - notes
    paths:
      - '.github/workflows/marketplace-node-diagnostic.yml'
  workflow_dispatch:

jobs:
  node-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          ref: notes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Node suite and capture output
        id: node-tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js 2>&1 | tee marketplace-node-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-node-diagnostic
          path: marketplace-node-output.txt
          if-no-files-found: error
