name: Notification app extraction

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/notification-app-extraction.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard verified files
        shell: bash
        run: |
          test "$(git hash-object js/app.js)" = "9f952ea64b17a61ba60a1fb8483148201ef46e82"
          test "$(git hash-object index.html)" = "24b8c82b51cbefd9e5db1e5e03bab8f2f203cb56"
          test "$(git hash-object tests/app-bootstrap-order.test.js)" = "b7386ff4048b5bf6c664d821607ae69c79baa527"
          test "$(git hash-object tests/route-state.test.js)" = "08739eb853b7ec9d8b0286ffcd87ce283b2dc766"
          test "$(git hash-object tests/notification-core.test.js)" = "4ef2759972259b358f185d8b6bfa75bad61038fa"

      - name: Apply guarded notification extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source,old,new,label):
              count=source.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old,new,1)

          app_path=Path('js/app.js')
          app=app_path.read_text()

          app=replace_once(
              app,
              "var NotificationCore=window.GroovyNotificationCore;\nif(!NotificationCore)throw new Error('GroovyNotificationCore must load before app.js');\nvar AppleSearchCore=window.GroovyAppleSearchCore;",
              "var NotificationCore=window.GroovyNotificationCore;\nif(!NotificationCore)throw new Error('GroovyNotificationCore must load before app.js');\nvar NotificationController=window.GroovyNotificationController;\nif(!NotificationController)throw new Error('GroovyNotificationController must load before app.js');\nvar AppleSearchCore=window.GroovyAppleSearchCore;",
              'notification controller declaration'
          )

          legacy_elements="""const notificationBox=document.getElementById('notificationBox');
          const notificationBellButton=document.getElementById('notificationBellButton');
          const notificationBadge=document.getElementById('notificationBadge');
          const notificationPanel=document.getElementById('notificationPanel');
          const notificationList=document.getElementById('notificationList');
          const markAllNotificationsRead=document.getElementById('markAllNotificationsRead');
          const clearNotificationsButton=document.getElementById('clearNotificationsButton');
          const followingButton=document.getElementById('followingButton');
          const viewedUserFollowButton=document.getElementById('viewedUserFollowButton');
          let notificationChannel=null;
          let notificationUserId=null;
          let notificationsCache=[];
          """.replace('          ','')
          replacement_elements="""const followingButton=document.getElementById('followingButton');
          const viewedUserFollowButton=document.getElementById('viewedUserFollowButton');
          """.replace('          ','')
          app=replace_once(app,legacy_elements,replacement_elements,'legacy notification elements and state')

          app,count=re.subn(
              r"var relativeNotificationTime=NotificationCore\.relativeTime;\n[\s\S]*?(?=function openCollectorRoute\(username,view\)\{)",
              '',app,count=1
          )
          if count!=1:
              raise SystemExit(f'legacy notification function block: expected one replacement, found {count}')

          route_function="""function openCollectorRoute(username,view){
              if(!username)return;
              var url=view==='profile'?'/profile/'+encodeURIComponent(username):'/shelf/'+encodeURIComponent(username);
              if(view==='wishlist')url+='?view=wishlist';
              history.pushState({},'',url);
              renderCurrentRoute();
          }
          """.replace('              ','')
          controller_create=route_function+"""
          var notificationController=NotificationController.create({
            elements:{
              box:document.getElementById('notificationBox'),
              bellButton:document.getElementById('notificationBellButton'),
              badge:document.getElementById('notificationBadge'),
              panel:document.getElementById('notificationPanel'),
              list:document.getElementById('notificationList'),
              markAllButton:document.getElementById('markAllNotificationsRead'),
              clearButton:document.getElementById('clearNotificationsButton')
            },
            api:supabaseClient,
            getCurrentUser:currentSessionUser,
            onNavigate:function(username,view){openCollectorRoute(username,view);},
            onBeforeOpen:function(){profileMenu.classList.remove('open');},
            onLog:function(level,message,error){
              if(level==='error')console.error(message,error||'');
              else if(level==='warn')console.warn(message,error||'');
              else console.log(message,error||'');
            }
          });
          """.replace('          ','')
          app=replace_once(app,route_function,controller_create,'notification controller creation')

          app,count=re.subn(
              r"if\(notificationBox\)notificationBox\.addEventListener\('click',[\s\S]*?(?=if\(followingButton\)followingButton\.addEventListener)",
              '',app,count=1
          )
          if count!=1:
              raise SystemExit(f'legacy notification event bindings: expected one replacement, found {count}')

          close_count=app.count('closeNotificationPanel();')
          if close_count!=4:
              raise SystemExit(f'closeNotificationPanel call count changed: {close_count}')
          app=app.replace('closeNotificationPanel();','notificationController.closePanel();')
          app=replace_once(app,'syncNotificationSubscription(user);','notificationController.syncUser(user);','signed-in notification sync')
          app=replace_once(app,'syncNotificationSubscription(null);','notificationController.syncUser(null);','signed-out notification sync')

          required={
              'controller declaration':'var NotificationController=window.GroovyNotificationController;',
              'controller guard':'GroovyNotificationController must load before app.js',
              'controller create':'NotificationController.create({',
              'signed-in sync':'notificationController.syncUser(user);',
              'signed-out sync':'notificationController.syncUser(null);',
              'social escape helper':'var escapeSocialHtml=NotificationCore.escapeHtml;'
          }
          for label,value in required.items():
              if app.count(value)!=1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {app.count(value)}')

          forbidden=[
              'let notificationChannel=',
              'let notificationUserId=',
              'let notificationsCache=',
              'var relativeNotificationTime=',
              'var notificationCopy=',
              'function closeNotificationPanel(',
              'function updateNotificationBadge(',
              'function renderNotifications(',
              'function loadNotifications(',
              'function markNotificationRead(',
              'function syncNotificationSubscription(',
              "supabaseClient.from('notifications')"
          ]
          leftovers=[value for value in forbidden if value in app]
          if leftovers:
              raise SystemExit('Legacy notification symbols remain in app.js: '+', '.join(leftovers))
          if len(app)>=176761:
              raise SystemExit('app.js did not shrink after notification extraction')
          app_path.write_text(app)

          index_path=Path('index.html')
          html=index_path.read_text()
          html=replace_once(html,'/js/app.js?v=148','/js/app.js?v=149','app cache version')
          index_path.write_text(html)

          route_test_path=Path('tests/route-state.test.js')
          route_test=route_test_path.read_text()
          marker="test('notification realtime channel is subscribed before the first awaited reload',function(){"
          if route_test.count(marker)!=1:
              raise SystemExit('notification realtime route test marker missing')
          prefix=route_test.split(marker,1)[0]
          route_test_new="""test('notification realtime channel is subscribed before the first awaited reload',function(){
            const fs=require('node:fs');
            const path=require('node:path');
            const controller=fs.readFileSync(path.resolve(__dirname,'..','js','notification-controller.js'),'utf8');
            const start=controller.indexOf('async function syncUser(user)');
            const end=controller.indexOf('async function togglePanel()',start);
            assert.ok(start>=0&&end>start);
            const block=controller.slice(start,end);
            const subscribe=block.indexOf('.subscribe();');
            const initialLoad=block.lastIndexOf('await load();');
            assert.ok(subscribe>=0&&initialLoad>subscribe,'channel must exist before an awaited notification load can race');
          });
          """.replace('          ','')
          route_test_path.write_text(prefix+route_test_new)

          core_test_path=Path('tests/notification-core.test.js')
          core_test=core_test_path.read_text()
          marker="test('notification core loads before app and app delegates pure formatting',function(){"
          if core_test.count(marker)!=1:
              raise SystemExit('notification core architecture test marker missing')
          prefix=core_test.split(marker,1)[0]
          core_test_new="""test('notification core and controller load before app and keep responsibilities separated',function(){
            const html=fs.readFileSync(path.join(root,'index.html'),'utf8');
            const app=fs.readFileSync(path.join(root,'js','app.js'),'utf8');
            const controller=fs.readFileSync(path.join(root,'js','notification-controller.js'),'utf8');
            const corePosition=html.search(/\\/js\\/notification-core\\.js\\?v=\\d+/);
            const controllerPosition=html.search(/\\/js\\/notification-controller\\.js\\?v=\\d+/);
            const appPosition=html.indexOf('/js/app.js?v=');
            assert.ok(corePosition>=0&&controllerPosition>corePosition&&appPosition>controllerPosition);
            assert.match(app,/var NotificationCore=window\\.GroovyNotificationCore/);
            assert.match(app,/var escapeSocialHtml=NotificationCore\\.escapeHtml/);
            assert.match(app,/var NotificationController=window\\.GroovyNotificationController/);
            assert.match(controller,/Core\\.escapeHtml/);
            assert.match(controller,/Core\\.relativeTime/);
            assert.match(controller,/Core\\.copy/);
            assert.doesNotMatch(app,/relativeNotificationTime|notificationCopy|function renderNotifications|function loadNotifications|syncNotificationSubscription/);
          });
          """.replace('          ','')
          core_test_path.write_text(prefix+core_test_new)

          bootstrap_path=Path('tests/app-bootstrap-order.test.js')
          bootstrap=bootstrap_path.read_text()
          marker="test('marketplace scripts load core, view and controller in order before app.js',()=>{"
          addition="""test('notification controller initializes before app integration',()=>{
            const source=fs.readFileSync('js/app.js','utf8');
            const declaration=source.indexOf('var NotificationController=window.GroovyNotificationController;');
            const create=source.indexOf('NotificationController.create({');
            assert.ok(declaration>=0&&create>declaration);
            assert.match(source,/GroovyNotificationController must load before app\\.js/);
            assert.doesNotMatch(source,/function renderNotifications|function loadNotifications|notificationChannel|notificationsCache|syncNotificationSubscription/);
          });

          """.replace('          ','')
          if addition.strip() in bootstrap:
              raise SystemExit('notification app integration test already exists')
          bootstrap=replace_once(bootstrap,marker,addition+marker,'notification app integration test')
          bootstrap_path.write_text(bootstrap)
          PY

      - name: Syntax checks
        run: |
          node --check js/app.js
          node --check js/notification-controller.js
          node --check tests/notification-controller.test.js
          node --check tests/notification-core.test.js
          node --check tests/route-state.test.js
          node --check tests/app-bootstrap-order.test.js

      - name: Run full Node regression suite
        run: node --test tests/*.test.js

      - name: Verify diff scope
        shell: bash
        run: |
          git diff --check
          printf '%s\n' "$(git diff --name-only | sort)" > /tmp/changed.txt
          printf '%s\n' 'index.html' 'js/app.js' 'tests/app-bootstrap-order.test.js' 'tests/notification-core.test.js' 'tests/route-state.test.js' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          echo "app.js bytes: $(wc -c < js/app.js)"
          git diff --stat

      - name: Commit notification extraction
        shell: bash
        run: |
          git config user.name 'Groovyshelf'
          git config user.email '150244154+Jeffaklumpen@users.noreply.github.com'
          git add index.html js/app.js tests/app-bootstrap-order.test.js tests/notification-core.test.js tests/route-state.test.js
          git commit -m 'Move notification flow into controller'
          git push origin HEAD:notes
