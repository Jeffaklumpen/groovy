name: Pressing core refactor checkpoint

on:
  push:
    branches: [tmp/pressing-core-refactor]
    paths:
      - '.github/workflows/pressing-core-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: tmp/pressing-core-refactor
          fetch-depth: 0

      - name: Extract pressing data helpers
        run: |
          node <<'NODE'
          const fs=require('fs');

          function sliceBetween(text,startMarker,endMarker,label){
            const start=text.indexOf(startMarker);
            const end=text.indexOf(endMarker,start);
            if(start<0||end<0||end<=start)throw new Error(label+' markers not found in expected order');
            return {start,end,text:text.slice(start,end)};
          }

          function replaceOnce(text,from,to,label){
            const count=text.split(from).length-1;
            if(count!==1)throw new Error(label+' expected once, found '+count);
            return text.replace(from,to);
          }

          let app=fs.readFileSync('js/app.js','utf8');

          const dependencyOld=`var Streaming=window.GroovyStreaming;\nvar NotificationCore=window.GroovyNotificationCore;\nif(!Record)throw new Error('GroovyRecord must load before app.js');`;
          const dependencyNew=`var Streaming=window.GroovyStreaming;\nvar NotificationCore=window.GroovyNotificationCore;\nvar PressingCore=window.GroovyPressingCore;\nif(!Record)throw new Error('GroovyRecord must load before app.js');`;
          app=replaceOnce(app,dependencyOld,dependencyNew,'pressing dependency insertion');
          app=replaceOnce(
            app,
            `if(!NotificationCore)throw new Error('GroovyNotificationCore must load before app.js');`,
            `if(!NotificationCore)throw new Error('GroovyNotificationCore must load before app.js');\nif(!PressingCore)throw new Error('GroovyPressingCore must load before app.js');`,
            'pressing dependency guard'
          );

          const blockA=sliceBetween(app,'function cleanVersionValue(value,fallback){','function setPressingOptions(', 'version helper block');
          const blockB=sliceBetween(app,'function pressingChoiceMatches(left,right){','function currentPressingMatches(', 'pressing match block');
          const blockD=sliceBetween(app,'function matrixChoices(release){','function simpleOptions(', 'matrix choice block');
          const matrixBlock=`function normalizedMatrix(value){\n  return String(value||'').normalize('NFKC').toLocaleLowerCase().replace(/[^a-z0-9]/g,'');\n}\n\nfunction matrixValues(release){\n  return (Array.isArray(release&&release.identifiers)?release.identifiers:[])\n    .filter(function(item){return /matrix|runout/i.test(String(item&&item.type||''));})\n    .map(function(item){return String(item.value||'').trim();})\n    .filter(Boolean);\n}\n\n`;
          if((app.split(matrixBlock).length-1)!==1)throw new Error('matrix helper block did not match exactly once');

          const aliases=`var cleanVersionValue=PressingCore.cleanVersionValue;\nvar normalizeVersion=PressingCore.normalizeVersion;\nvar uniqueVersionValues=PressingCore.uniqueVersionValues;\nvar pressingChoiceMatches=PressingCore.pressingChoiceMatches;\nvar pressingYearMatches=PressingCore.pressingYearMatches;\nvar pressingCatalogMatches=PressingCore.pressingCatalogMatches;\nvar normalizedMatrix=PressingCore.normalizedMatrix;\nvar matrixValues=PressingCore.matrixValues;\nvar matrixChoices=PressingCore.matrixChoices;\nvar vinylDiscCount=PressingCore.vinylDiscCount;\n\n`;

          app=app.slice(0,blockA.start)+aliases+app.slice(blockA.end);
          app=replaceOnce(app,blockB.text,'','pressing match extraction');
          app=replaceOnce(app,matrixBlock,'','matrix helper extraction');
          app=replaceOnce(app,blockD.text,'','matrix choice extraction');
          fs.writeFileSync('js/app.js',app);

          const moduleSource=`(function(root,factory){\n  var api=factory();\n  if(typeof module==='object'&&module.exports)module.exports=api;\n  if(root)root.GroovyPressingCore=api;\n})(typeof window!=='undefined'?window:null,function(){\n${blockA.text}${blockB.text}${matrixBlock}${blockD.text}  return Object.freeze({\n    cleanVersionValue:cleanVersionValue,\n    normalizeVersion:normalizeVersion,\n    uniqueVersionValues:uniqueVersionValues,\n    pressingChoiceMatches:pressingChoiceMatches,\n    pressingYearMatches:pressingYearMatches,\n    pressingCatalogMatches:pressingCatalogMatches,\n    normalizedMatrix:normalizedMatrix,\n    matrixValues:matrixValues,\n    matrixChoices:matrixChoices,\n    vinylDiscCount:vinylDiscCount\n  });\n});\n`;
          fs.writeFileSync('js/pressing-core.js',moduleSource);

          let html=fs.readFileSync('index.html','utf8');
          html=replaceOnce(
            html,
            `<script src="/js/notification-core.js?v=1"></script>\n<script src="/js/wikipedia-service.js?v=1"></script>\n<script src="/js/app.js?v=129"></script>`,
            `<script src="/js/notification-core.js?v=1"></script>\n<script src="/js/pressing-core.js?v=1"></script>\n<script src="/js/wikipedia-service.js?v=1"></script>\n<script src="/js/app.js?v=130"></script>`,
            'script loading block'
          );
          fs.writeFileSync('index.html',html);

          let architecture=fs.readFileSync('docs/ARCHITECTURE.md','utf8');
          architecture=replaceOnce(
            architecture,
            '- `js/streaming-links.js` — pure Spotify and Apple Music URL construction shared by feature code.\n',
            '- `js/streaming-links.js` — pure Spotify and Apple Music URL construction shared by feature code.\n- `js/pressing-core.js` — pure Discogs pressing normalization, matching, matrix/runout and vinyl-format helpers.\n',
            'architecture module list'
          );
          fs.writeFileSync('docs/ARCHITECTURE.md',architecture);

          fs.writeFileSync('tests/pressing-core.test.js',`const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst Pressing=require('../js/pressing-core.js');\n\ntest('normalizes Discogs version data without UI dependencies',()=>{\n  assert.deepEqual(Pressing.normalizeVersion({\n    id:123,title:'  The Wall  ',country:' UK ',released:'1979-11-30',\n    label:['Harvest','EMI'],catno:' SHDW 411 ',format:['Vinyl','LP']\n  }),{id:123,title:'The Wall',country:'UK',year:'1979',label:'Harvest, EMI',catalogNumber:'SHDW 411',format:'Vinyl, LP'});\n});\n\ntest('deduplicates pressing filter values case-insensitively and sorts them',()=>{\n  assert.deepEqual(\n    Pressing.uniqueVersionValues([{label:'Harvest'},{label:'harvest'},{label:' EMI '},{label:''}],'label'),\n    ['EMI','Harvest']\n  );\n});\n\ntest('matches pressing choices, uncertain years and catalog punctuation',()=>{\n  assert.equal(Pressing.pressingChoiceMatches(' UK ','uk'),true);\n  assert.equal(Pressing.pressingYearMatches('', '1973'),true);\n  assert.equal(Pressing.pressingYearMatches('1973','1974'),false);\n  assert.equal(Pressing.pressingCatalogMatches('SMAS-11163','SMAS 11163'),true);\n});\n\ntest('normalizes and extracts Discogs matrix runouts',()=>{\n  assert.equal(Pressing.normalizedMatrix('SMAS-11163 A-2'),'smas11163a2');\n  assert.deepEqual(Pressing.matrixValues({identifiers:[\n    {type:'Matrix / Runout',value:' SMAS-11163 A-2 '},\n    {type:'Barcode',value:'123'},\n    {type:'Runout',value:'SMAS-11163 B-2'}\n  ]}),['SMAS-11163 A-2','SMAS-11163 B-2']);\n});\n\ntest('groups matrix choices by side and detects vinyl disc count',()=>{\n  const choices=Pressing.matrixChoices({identifiers:[\n    {type:'Matrix / Runout',description:'Side A',value:'AAA A-1'},\n    {type:'Matrix / Runout',description:'Side B',value:'BBB B-1'}\n  ]});\n  assert.deepEqual(choices.a,['AAA A-1']);\n  assert.deepEqual(choices.b,['BBB B-1']);\n  assert.equal(Pressing.vinylDiscCount({formats:[{name:'Vinyl',qty:'1',descriptions:['2 x LP','Album']}]}),2);\n  assert.equal(Pressing.vinylDiscCount({formats:[{name:'Vinyl',qty:'3'}]}),3);\n});\n`);
          NODE

      - name: Validate syntax and regression suite
        run: |
          node --check js/pressing-core.js
          node --check js/app.js
          node --test tests/*.test.js

      - name: Commit stable checkpoint
        run: |
          rm .github/workflows/pressing-core-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Discogs pressing core helpers"
          git push origin HEAD:tmp/pressing-core-refactor
