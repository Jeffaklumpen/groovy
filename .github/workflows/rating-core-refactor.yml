name: Rating core refactor checkpoint

on:
  push:
    branches: [tmp/rating-core-refactor]
    paths:
      - '.github/workflows/rating-core-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: tmp/rating-core-refactor
          fetch-depth: 0

      - name: Extract rating helpers
        run: |
          node <<'NODE'
          const fs=require('fs');

          function replaceExactly(path,from,to,label){
            const text=fs.readFileSync(path,'utf8');
            const matches=text.split(from).length-1;
            if(matches!==1)throw new Error(label+' expected exactly once, found '+matches);
            fs.writeFileSync(path,text.replace(from,to));
          }

          const dependencyOld=String.raw`var Record=window.GroovyRecord;
          var Wikipedia=window.GroovyWikipedia;
          var Streaming=window.GroovyStreaming;
          var NotificationCore=window.GroovyNotificationCore;
          var PressingCore=window.GroovyPressingCore;
          if(!Record)throw new Error('GroovyRecord must load before app.js');
          if(!Wikipedia)throw new Error('GroovyWikipedia must load before app.js');
          if(!Streaming)throw new Error('GroovyStreaming must load before app.js');
          if(!NotificationCore)throw new Error('GroovyNotificationCore must load before app.js');
          if(!PressingCore)throw new Error('GroovyPressingCore must load before app.js');`;
          const dependencyNew=String.raw`var Record=window.GroovyRecord;
          var Wikipedia=window.GroovyWikipedia;
          var Streaming=window.GroovyStreaming;
          var NotificationCore=window.GroovyNotificationCore;
          var PressingCore=window.GroovyPressingCore;
          var RatingCore=window.GroovyRatingCore;
          if(!Record)throw new Error('GroovyRecord must load before app.js');
          if(!Wikipedia)throw new Error('GroovyWikipedia must load before app.js');
          if(!Streaming)throw new Error('GroovyStreaming must load before app.js');
          if(!NotificationCore)throw new Error('GroovyNotificationCore must load before app.js');
          if(!PressingCore)throw new Error('GroovyPressingCore must load before app.js');
          if(!RatingCore)throw new Error('GroovyRatingCore must load before app.js');`;
          replaceExactly('js/app.js',dependencyOld,dependencyNew,'dependency block');

          const helpersOld=String.raw`function clampGroovyRating(value){
            var numeric=Number(value);
            if(!isFinite(numeric))numeric=0;
            return Math.max(0,Math.min(5,numeric));
          }

          function formatCommunityRating(value){
            var numeric=clampGroovyRating(value);
            if(!numeric)return '—';
            var rounded=Math.round(numeric*10)/10;
            return Number.isInteger(rounded)?String(rounded.toFixed(0)):String(rounded.toFixed(1));
          }

          function ratingFillPercent(value){
            return (clampGroovyRating(value)/5*100).toFixed(1)+'%';
          }`;
          const helpersNew=String.raw`function clampGroovyRating(value){
            return RatingCore.clamp(value);
          }

          function formatCommunityRating(value){
            return RatingCore.format(value);
          }

          function ratingFillPercent(value){
            return RatingCore.fillPercent(value);
          }`;
          replaceExactly('js/app.js',helpersOld,helpersNew,'rating helper block');

          const scriptsOld=String.raw`<script src="/js/streaming-links.js?v=1"></script>
          <script src="/js/notification-core.js?v=1"></script>
          <script src="/js/pressing-core.js?v=1"></script>
          <script src="/js/wikipedia-service.js?v=1"></script>
          <script src="/js/app.js?v=131"></script>`;
          const scriptsNew=String.raw`<script src="/js/streaming-links.js?v=1"></script>
          <script src="/js/notification-core.js?v=1"></script>
          <script src="/js/pressing-core.js?v=1"></script>
          <script src="/js/rating-core.js?v=1"></script>
          <script src="/js/wikipedia-service.js?v=1"></script>
          <script src="/js/app.js?v=132"></script>`;
          replaceExactly('index.html',scriptsOld,scriptsNew,'script loading block');

          const architectureOld='- `js/pressing-core.js` — pure Discogs pressing normalization, matching, matrix/runout and vinyl-format helpers.';
          const architectureNew=architectureOld+'\n- `js/rating-core.js` — pure 0–5 rating normalization and display formatting helpers.';
          replaceExactly('docs/ARCHITECTURE.md',architectureOld,architectureNew,'architecture pressing line');

          fs.writeFileSync('js/rating-core.js',String.raw`(function(root,factory){
            var api=factory();
            if(typeof module==='object'&&module.exports)module.exports=api;
            if(root)root.GroovyRatingCore=api;
          })(typeof window!=='undefined'?window:null,function(){
            function clamp(value){
              var numeric=Number(value);
              if(!isFinite(numeric))numeric=0;
              return Math.max(0,Math.min(5,numeric));
            }

            function format(value){
              var numeric=clamp(value);
              if(!numeric)return '—';
              var rounded=Math.round(numeric*10)/10;
              return Number.isInteger(rounded)?String(rounded.toFixed(0)):String(rounded.toFixed(1));
            }

            function fillPercent(value){
              return (clamp(value)/5*100).toFixed(1)+'%';
            }

            return Object.freeze({clamp:clamp,format:format,fillPercent:fillPercent});
          });
          `);

          fs.writeFileSync('tests/rating-core.test.js',String.raw`const test=require('node:test');
          const assert=require('node:assert/strict');
          const Rating=require('../js/rating-core.js');

          test('clamps ratings to the 0-5 range',()=>{
            assert.equal(Rating.clamp(-2),0);
            assert.equal(Rating.clamp(3.7),3.7);
            assert.equal(Rating.clamp(9),5);
            assert.equal(Rating.clamp('not-a-number'),0);
          });

          test('formats community ratings exactly as the app did',()=>{
            assert.equal(Rating.format(0),'—');
            assert.equal(Rating.format(4),'4');
            assert.equal(Rating.format(4.24),'4.2');
            assert.equal(Rating.format(4.25),'4.3');
          });

          test('builds stable star fill percentages',()=>{
            assert.equal(Rating.fillPercent(0),'0.0%');
            assert.equal(Rating.fillPercent(2.5),'50.0%');
            assert.equal(Rating.fillPercent(5),'100.0%');
            assert.equal(Rating.fillPercent(8),'100.0%');
          });
          `);

          fs.writeFileSync('tests/app-bootstrap-order.test.js',String.raw`const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('fs');

          test('notification core is initialized before first use in app.js',()=>{
            const source=fs.readFileSync('js/app.js','utf8');
            const declaration=source.indexOf('var NotificationCore=window.GroovyNotificationCore;');
            const firstUse=source.indexOf('NotificationCore.escapeHtml');
            assert.ok(declaration>=0,'NotificationCore bootstrap declaration is missing');
            assert.ok(firstUse>=0,'NotificationCore first use is missing');
            assert.ok(declaration<firstUse,'NotificationCore must be initialized before it is used');
          });

          test('pure dependency scripts load before app.js',()=>{
            const html=fs.readFileSync('index.html','utf8');
            const app=html.indexOf('/js/app.js?v=');
            assert.ok(app>=0,'app.js script is missing');
            ['/js/notification-core.js?v=','/js/pressing-core.js?v=','/js/rating-core.js?v='].forEach((script)=>{
              const pos=html.indexOf(script);
              assert.ok(pos>=0,script+' script is missing');
              assert.ok(pos<app,script+' must load before app.js');
            });
            assert.match(html,/\/js\/app\.js\?v=\d+/);
          });
          `);
          NODE

      - name: Validate syntax and regression suite
        run: |
          node --check js/rating-core.js
          node --check js/app.js
          node --test tests/*.test.js

      - name: Commit stable checkpoint
        run: |
          rm .github/workflows/rating-core-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract rating core helpers"
          git push origin HEAD:tmp/rating-core-refactor
