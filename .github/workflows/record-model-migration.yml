name: Record model adapter migration

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/record-model-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add named record adapter
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');

          function replaceExact(source,from,to,label,expected=1){
            const count=source.split(from).length-1;
            if(count!==expected)throw new Error(label+': expected '+expected+', found '+count);
            return source.split(from).join(to);
          }

          if(fs.existsSync('js/record-model.js'))throw new Error('record-model.js already exists');

          fs.writeFileSync('js/record-model.js',`(function(windowObject){
          'use strict';
          if(!windowObject)return;

          var INDEX=Object.freeze({
            order:0, artist:1, title:2, year:3, genre:4,
            ownRating:5, coverUrl:6, sides:7, albumId:8, entryId:9,
            discogsMasterId:10, pressing:11, appleUrl:12, shelfId:13,
            shelfSortOrder:14, communityRating:15, communityCount:16
          });

          function value(record,name){
            var index=INDEX[name];
            return record&&index!==undefined?record[index]:undefined;
          }

          function setRatings(record,own,community,count){
            if(!record)return record;
            record[INDEX.ownRating]=own;
            record[INDEX.communityRating]=community;
            record[INDEX.communityCount]=count;
            return record;
          }

          var api={INDEX:INDEX,value:value,setRatings:setRatings};
          Object.keys(INDEX).forEach(function(name){
            api[name]=function(record){return value(record,name);};
          });

          windowObject.GroovyRecord=Object.freeze(api);
          })(typeof window!=='undefined'?window:null);
          `);

          let index=fs.readFileSync('index.html','utf8');
          index=replaceExact(
            index,
            '<script src="/js/route-state.js?v=20"></script>\n<script src="/js/app.js?v=125"></script>',
            '<script src="/js/route-state.js?v=20"></script>\n<script src="/js/record-model.js?v=1"></script>\n<script src="/js/app.js?v=125"></script>',
            'index script order'
          );
          index=replaceExact(index,'/js/detail-enhancements-v2.js?v=8','/js/detail-enhancements-v2.js?v=9','detail cache version');
          index=replaceExact(index,'/js/album-rating-layout-v4.js?v=2','/js/album-rating-layout-v4.js?v=3','rating cache version');
          fs.writeFileSync('index.html',index);

          let detail=fs.readFileSync('js/detail-enhancements-v2.js','utf8');
          detail=replaceExact(detail,"'use strict';\n","'use strict';\n\nvar Record=window.GroovyRecord;\nif(!Record)return;\n",'detail adapter');
          detail=replaceExact(detail,
            `    record[5]=entry.own||0;\n    record[15]=entry.average||0;\n    record[16]=entry.count||0;`,
            `    Record.setRatings(record,entry.own||0,entry.average||0,entry.count||0);`,
            'wishlist rating assignment'
          );
          detail=replaceExact(detail,
            `    item[5]=0;\n    item[15]=nextAverage;\n    item[16]=nextCount;`,
            `    Record.setRatings(item,0,nextAverage,nextCount);`,
            'remove rating assignment'
          );

          const detailReads=[
            ['current[2]','Record.title(current)'],
            ['current[1]','Record.artist(current)'],
            ['record[2]','Record.title(record)'],
            ['record[1]','Record.artist(record)'],
            ['record[4]','Record.genre(record)'],
            ['record[5]','Record.ownRating(record)'],
            ['record[6]','Record.coverUrl(record)'],
            ['record[8]','Record.albumId(record)'],
            ['record[9]','Record.entryId(record)'],
            ['record[10]','Record.discogsMasterId(record)'],
            ['record[15]','Record.communityRating(record)'],
            ['record[16]','Record.communityCount(record)'],
            ['item[8]','Record.albumId(item)']
          ];
          detailReads.forEach(function(pair){detail=detail.split(pair[0]).join(pair[1]);});
          if(/\b(?:record|current|item)\[(?:1|2|4|5|6|8|9|10|15|16)\]/.test(detail)){
            throw new Error('detail module still contains migrated magic indexes');
          }
          fs.writeFileSync('js/detail-enhancements-v2.js',detail);

          let layout=fs.readFileSync('js/album-rating-layout-v4.js','utf8');
          layout=replaceExact(layout,"'use strict';\n","'use strict';\n\nvar Record=window.GroovyRecord;\nif(!Record)return;\n",'rating adapter');
          const layoutReads=[
            ['record[2]','Record.title(record)'],
            ['record[1]','Record.artist(record)'],
            ['record[5]','Record.ownRating(record)'],
            ['record[8]','Record.albumId(record)'],
            ['record[15]','Record.communityRating(record)'],
            ['record[16]','Record.communityCount(record)']
          ];
          layoutReads.forEach(function(pair){layout=layout.split(pair[0]).join(pair[1]);});
          if(/\brecord\[(?:1|2|5|8|15|16)\]/.test(layout))throw new Error('rating module still contains migrated magic indexes');
          fs.writeFileSync('js/album-rating-layout-v4.js',layout);

          let pwa=fs.readFileSync('tests/pwa.test.js','utf8');
          pwa=replaceExact(pwa,'src="\\/js\\/album-rating-layout-v4\\.js\\?v=2"','src="\\/js\\/album-rating-layout-v4\\.js\\?v=3"','pwa rating cache assertion');
          pwa=replaceExact(pwa,'src="\\/js\\/detail-enhancements-v2\\.js\\?v=8"','src="\\/js\\/detail-enhancements-v2\\.js\\?v=9"','pwa detail cache assertion');
          fs.writeFileSync('tests/pwa.test.js',pwa);

          let ratingTests=fs.readFileSync('tests/rating.test.js','utf8');
          ratingTests=replaceExact(ratingTests,'detail-enhancements-v2\\.js\\?v=8','detail-enhancements-v2\\.js\\?v=9','rating detail cache assertion');
          ratingTests=replaceExact(ratingTests,'album-rating-layout-v4\\.js\\?v=2','album-rating-layout-v4\\.js\\?v=3','rating layout cache assertion');
          fs.writeFileSync('tests/rating.test.js',ratingTests);

          fs.writeFileSync('tests/record-model.test.js',`const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const test=require('node:test');
          const vm=require('node:vm');
          const root=path.resolve(__dirname,'..');

          function loadModel(){
            const source=fs.readFileSync(path.join(root,'js','record-model.js'),'utf8');
            const context={window:{}};
            vm.runInNewContext(source,context);
            return context.window.GroovyRecord;
          }

          test('record model names legacy tuple fields without changing storage',function(){
            const Record=loadModel();
            const record=[1,'Pink Floyd','The Wall',1979,'Rock',4,'cover.jpg',{},42,99,123,{},'',null,null,4.5,10];
            assert.equal(Record.artist(record),'Pink Floyd');
            assert.equal(Record.title(record),'The Wall');
            assert.equal(Record.albumId(record),42);
            assert.equal(Record.communityRating(record),4.5);
            Record.setRatings(record,5,4.6,11);
            assert.equal(record[5],5);
            assert.equal(record[15],4.6);
            assert.equal(record[16],11);
          });

          test('record model loads before consumers and separated modules use named accessors',function(){
            const html=fs.readFileSync(path.join(root,'index.html'),'utf8');
            const detail=fs.readFileSync(path.join(root,'js','detail-enhancements-v2.js'),'utf8');
            const layout=fs.readFileSync(path.join(root,'js','album-rating-layout-v4.js'),'utf8');
            const modelPosition=html.indexOf('/js/record-model.js?v=1');
            const appPosition=html.indexOf('/js/app.js?v=125');
            assert.ok(modelPosition>=0&&appPosition>modelPosition);
            assert.match(detail,/var Record=window\.GroovyRecord/);
            assert.match(layout,/var Record=window\.GroovyRecord/);
            assert.doesNotMatch(detail,/\b(?:record|current|item)\[(?:1|2|4|5|6|8|9|10|15|16)\]/);
            assert.doesNotMatch(layout,/\brecord\[(?:1|2|5|8|15|16)\]/);
          });
          `);
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check js/record-model.js
          node --check js/detail-enhancements-v2.js
          node --check js/album-rating-layout-v4.js
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Commit migration and remove temporary workflow
        run: |
          rm -f .github/workflows/record-model-migration.yml
          git config user.name "GroovyShelves Maintenance"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No migration changes to commit"; exit 1; }
          git commit -m "Introduce named record adapter"
          git push origin notes
