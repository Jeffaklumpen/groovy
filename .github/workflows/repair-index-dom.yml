name: Repair index DOM

on:
  push:
    branches: [notes]
    paths:
      - '.maintenance/repair_index_dom.js'
      - '.github/workflows/repair-index-dom.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch backup branch
        run: git fetch origin backup/foundation-cleanup-2026-09-16:refs/remotes/origin/backup/foundation-cleanup-2026-09-16
      - name: Repair index DOM
        run: node .maintenance/repair_index_dom.js
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Commit repair and remove temporary diagnostics
        run: |
          git config user.name "GroovyShelves Maintenance"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          rm -f .github/workflows/dom-diagnostic.yml .maintenance/dom_diagnostic.js
          rm -f .github/workflows/repair-index-dom.yml .maintenance/repair_index_dom.js
          git add -A
          git commit -m "Repair index DOM contract"
          git push origin notes
