name: Social refactor checkpoint

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/social-refactor.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard verified files
        shell: bash
        run: |
          test "$(git hash-object js/app.js)" = "28294e9553bea2566695fc1a34f5679fac54b5a8"
          test "$(git hash-object index.html)" = "b7dfcd7858aabf73d040bb16a377ef576f415f2f"
          test "$(git hash-object tests/app-bootstrap-order.test.js)" = "655d099f977ac04a960ba03c8ed64d6bba2c2d0a"

      - name: Apply guarded social extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source,old,new,label):
              count=source.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old,new,1)

          app_path=Path('js/app.js')
          app=app_path.read_text()

          app=replace_once(
              app,
              "var NotificationController=window.GroovyNotificationController;\nif(!NotificationController)throw new Error('GroovyNotificationController must load before app.js');\nvar AppleSearchCore=window.GroovyAppleSearchCore;",
              "var NotificationController=window.GroovyNotificationController;\nif(!NotificationController)throw new Error('GroovyNotificationController must load before app.js');\nvar SocialController=window.GroovySocialController;\nif(!SocialController)throw new Error('GroovySocialController must load before app.js');\nvar AppleSearchCore=window.GroovyAppleSearchCore;",
              'social controller declaration'
          )

          app=replace_once(app,"const followingButton=document.getElementById('followingButton');\n",'', 'following button ownership')

          app=replace_once(
              app,
              'await groovyFollowingIds(users.map(function(user){return user.id;}))',
              'await socialController.followingIds(users.map(function(user){return user.id;}))',
              'search result following ids delegation'
          )
          app=replace_once(
              app,
              'await groovyFollowingIds(data.map(function(user){return user.id;}))',
              'await socialController.followingIds(data.map(function(user){return user.id;}))',
              'typed search following ids delegation'
          )

          app,count=re.subn(
              r"async function groovyFollowingIds\(userIds\)\{[\s\S]*?(?=function openCollectorRoute\(username,view\)\{)",
              '',
              app,
              count=1
          )
          if count!=1:
              raise SystemExit(f'legacy follow API block: expected one replacement, found {count}')

          route_function="""function openCollectorRoute(username,view){
              if(!username)return;
              var url=view==='profile'?'/profile/'+encodeURIComponent(username):'/shelf/'+encodeURIComponent(username);
              if(view==='wishlist')url+='?view=wishlist';
              history.pushState({},'',url);
              renderCurrentRoute();
          }
          """.replace('          ','')
          controller_create=route_function+"""
          var socialController=SocialController.create({
            elements:{
              followingButton:document.getElementById('followingButton'),
              viewedUserFollowButton:viewedUserFollowButton
            },
            api:supabaseClient,
            window:window,
            document:document,
            getCurrentUser:currentSessionUser,
            escapeHtml:escapeSocialHtml,
            onNavigate:function(username,view){openCollectorRoute(username,view);},
            onOpenFollowingRoute:function(){history.pushState({},'','/following');renderCurrentRoute();},
            onBackHome:function(){history.pushState({},'','/');renderCurrentRoute();},
            onRequireAuth:function(){openAuthPanel('login');history.replaceState({},'','/');},
            onBeforeFollowingOpen:function(){profileMenu.classList.remove('open');},
            onLog:function(level,message,error){
              if(level==='error')console.error(message,error||'');
              else if(level==='warn')console.warn(message,error||'');
              else console.log(message,error||'');
            }
          });
          """.replace('          ','')
          app=replace_once(app,route_function,controller_create,'social controller creation')

          app,count=re.subn(
              r"function ensureFollowingPage\(\)\{[\s\S]*?(?=loginClose\.addEventListener\('click')",
              '',
              app,
              count=1
          )
          if count!=1:
              raise SystemExit(f'legacy following page block: expected one replacement, found {count}')

          app,count=re.subn(
              r"window\.addEventListener\('groovy-follow-changed',function\(event\)\{[\s\S]*?\n\}\);",
              '',
              app,
              count=1
          )
          if count!=1:
              raise SystemExit(f'legacy follow-change listener: expected one replacement, found {count}')

          viewed_pattern=(
              r"if\(viewedUserFollowButton\)viewedUserFollowButton\.addEventListener\('click',[\s\S]*?"
              r"(?=emptyWishlistAddButton\.addEventListener\('click')"
          )
          app,count=re.subn(viewed_pattern,'',app,count=1)
          if count!=1:
              raise SystemExit(f'legacy viewed follow listener: expected one replacement, found {count}')

          replacements={
              'setFollowButtonState(':'socialController.setFollowButtonState(',
              'setViewedUserFollowState(':'socialController.setViewedUserFollowState(',
              'hideFollowingPage();':'socialController.hideFollowingPage();',
              'await renderFollowingPage();':'await socialController.renderFollowingPage();'
          }
          for old,new in replacements.items():
              if old not in app:
                  raise SystemExit(f'reference replacement missing: {old}')
              app=app.replace(old,new)

          required={
              'controller declaration':'var SocialController=window.GroovySocialController;',
              'controller guard':'GroovySocialController must load before app.js',
              'controller create':'SocialController.create({',
              'following ids delegate':'socialController.followingIds(',
              'button state delegate':'socialController.setFollowButtonState(',
              'viewed state delegate':'socialController.setViewedUserFollowState(',
              'following render delegate':'await socialController.renderFollowingPage();',
              'following hide delegate':'socialController.hideFollowingPage();',
              'social escape helper':'var escapeSocialHtml=NotificationCore.escapeHtml;'
          }
          for label,value in required.items():
              if value not in app:
                  raise SystemExit(f'{label} is missing after extraction')

          forbidden=[
              "const followingButton=document.getElementById('followingButton')",
              'async function groovyFollowingIds(',
              'window.groovyIsFollowing=async function',
              'window.groovyFollowUser=async function',
              'window.groovyUnfollowUser=async function',
              'function setFollowButtonState(',
              'function setViewedUserFollowState(',
              'function ensureFollowingPage(',
              'function hideFollowingPage(',
              'async function renderFollowingPage(',
              "window.addEventListener('groovy-follow-changed'",
              "if(viewedUserFollowButton)viewedUserFollowButton.addEventListener('click'",
              "supabaseClient.from('user_follows')",
              "supabaseClient.rpc('get_following_overview')"
          ]
          leftovers=[value for value in forbidden if value in app]
          if leftovers:
              raise SystemExit('Legacy social symbols remain in app.js: '+', '.join(leftovers))
          if len(app)>=171003:
              raise SystemExit('app.js did not shrink after social extraction')
          app_path.write_text(app)

          index_path=Path('index.html')
          html=index_path.read_text()
          html=replace_once(html,'/js/app.js?v=149','/js/app.js?v=150','app cache version')
          index_path.write_text(html)

          bootstrap_path=Path('tests/app-bootstrap-order.test.js')
          bootstrap=bootstrap_path.read_text()
          marker="test('marketplace scripts load core, view and controller in order before app.js',()=>{"
          addition="""test('social controller initializes before app integration',()=>{
            const source=fs.readFileSync('js/app.js','utf8');
            const declaration=source.indexOf('var SocialController=window.GroovySocialController;');
            const create=source.indexOf('SocialController.create({');
            assert.ok(declaration>=0&&create>declaration);
            assert.match(source,/GroovySocialController must load before app\\.js/);
            assert.doesNotMatch(source,/async function groovyFollowingIds|function ensureFollowingPage|function renderFollowingPage|supabaseClient\\.from\\('user_follows'\\)/);
          });

          """.replace('          ','')
          if addition.strip() in bootstrap:
              raise SystemExit('social app integration test already exists')
          bootstrap=replace_once(bootstrap,marker,addition+marker,'social app integration test')
          bootstrap_path.write_text(bootstrap)
          PY

      - name: Syntax checks
        run: |
          node --check js/app.js
          node --check js/social-controller.js
          node --check tests/social-controller.test.js
          node --check tests/app-bootstrap-order.test.js

      - name: Run full Node regression suite
        run: node --test tests/*.test.js

      - name: Verify diff scope
        shell: bash
        run: |
          git diff --check
          printf '%s\n' "$(git diff --name-only | sort)" > /tmp/changed.txt
          printf '%s\n' 'index.html' 'js/app.js' 'tests/app-bootstrap-order.test.js' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit social extraction
        shell: bash
        run: |
          git config user.name 'Groovyshelf'
          git config user.email '150244154+Jeffaklumpen@users.noreply.github.com'
          git add index.html js/app.js tests/app-bootstrap-order.test.js
          git commit -m 'Move social following flow into controller'
          git push origin HEAD:notes
