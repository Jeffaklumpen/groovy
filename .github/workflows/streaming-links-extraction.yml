# Retry after verifying current app.js anchors.
name: Streaming links extraction

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/streaming-links-extraction.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract streaming links
        run: |
          node <<'NODE'
          const fs=require('fs');

          function replaceExact(source,from,to,label,expected=1){
            const count=source.split(from).length-1;
            if(count!==expected)throw new Error(label+': expected '+expected+', found '+count);
            return source.split(from).join(to);
          }
          function removeUntil(source,startMarker,nextMarker,label){
            const start=source.indexOf(startMarker);
            if(start<0)throw new Error(label+': start marker missing');
            const next=source.indexOf(nextMarker,start+startMarker.length);
            if(next<0)throw new Error(label+': next marker missing');
            return source.slice(0,start)+source.slice(next);
          }

          const service=`(function(windowObject){
          'use strict';
          if(!windowObject)return;
          var Record=windowObject.GroovyRecord;
          if(!Record)throw new Error('GroovyRecord must load before streaming-links.js');

          function spotifyAlbumLink(record){
            var query=[Record.artist(record),Record.title(record)].filter(Boolean).join(' ');
            return 'https://open.spotify.com/search/'+encodeURIComponent(query);
          }

          function appleMusicAlbumLink(record){
            var savedUrl=Record.appleUrl(record);
            if(/^https:\\/\\/(?:music|itunes)\\.apple\\.com\\//.test(String(savedUrl||'')))return savedUrl;
            var query=[Record.artist(record),Record.title(record)].filter(Boolean).join(' ');
            return 'https://music.apple.com/se/search?term='+encodeURIComponent(query);
          }

          windowObject.GroovyStreaming=Object.freeze({
            spotifyAlbumLink:spotifyAlbumLink,
            appleMusicAlbumLink:appleMusicAlbumLink
          });
          })(typeof window!=='undefined'?window:null);
          `;
          if(fs.existsSync('js/streaming-links.js'))throw new Error('js/streaming-links.js already exists');
          fs.writeFileSync('js/streaming-links.js',service);

          let index=fs.readFileSync('index.html','utf8');
          index=replaceExact(index,
            '<script src="/js/wikipedia-service.js?v=1"></script>\n<script src="/js/app.js?v=127"></script>',
            '<script src="/js/wikipedia-service.js?v=1"></script>\n<script src="/js/streaming-links.js?v=1"></script>\n<script src="/js/app.js?v=128"></script>',
            'streaming script order');
          fs.writeFileSync('index.html',index);

          let app=fs.readFileSync('js/app.js','utf8');
          app=replaceExact(app,
            "var Record=window.GroovyRecord;\nvar Wikipedia=window.GroovyWikipedia;\nif(!Record)throw new Error('GroovyRecord must load before app.js');\nif(!Wikipedia)throw new Error('GroovyWikipedia must load before app.js');",
            "var Record=window.GroovyRecord;\nvar Wikipedia=window.GroovyWikipedia;\nvar Streaming=window.GroovyStreaming;\nif(!Record)throw new Error('GroovyRecord must load before app.js');\nif(!Wikipedia)throw new Error('GroovyWikipedia must load before app.js');\nif(!Streaming)throw new Error('GroovyStreaming must load before app.js');",
            'streaming app dependency');
          app=removeUntil(app,'function spotifyAlbumLink(record){','function recordDisplayNumber(record){','streaming link block');
          app=app.split('spotifyAlbumLink(').join('Streaming.spotifyAlbumLink(');
          app=app.split('appleMusicAlbumLink(').join('Streaming.appleMusicAlbumLink(');
          if(app.includes('function spotifyAlbumLink(')||app.includes('function appleMusicAlbumLink('))throw new Error('Streaming helpers remain in app.js');
          fs.writeFileSync('js/app.js',app);

          for(const file of fs.readdirSync('tests').filter(name=>name.endsWith('.test.js'))){
            const path='tests/'+file;
            let source=fs.readFileSync(path,'utf8');
            source=source.split('app\\.js\\?v=127').join('app\\.js\\?v=128');
            source=source.split('/js/app.js?v=127').join('/js/app.js?v=128');
            fs.writeFileSync(path,source);
          }

          fs.writeFileSync('tests/streaming-links.test.js',`const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const test=require('node:test');
          const vm=require('node:vm');
          const root=path.resolve(__dirname,'..');

          function loadService(){
            const source=fs.readFileSync(path.join(root,'js','streaming-links.js'),'utf8');
            const windowObject={GroovyRecord:{artist:r=>r[1],title:r=>r[2],appleUrl:r=>r[12]}};
            vm.runInNewContext(source,{window:windowObject,encodeURIComponent});
            return windowObject.GroovyStreaming;
          }

          test('streaming service builds Spotify and Apple Music links',function(){
            const Streaming=loadService();
            const record=[0,'Pink Floyd','The Wall',0,0,0,0,0,0,0,0,0,''];
            assert.equal(Streaming.spotifyAlbumLink(record),'https://open.spotify.com/search/Pink%20Floyd%20The%20Wall');
            assert.equal(Streaming.appleMusicAlbumLink(record),'https://music.apple.com/se/search?term=Pink%20Floyd%20The%20Wall');
            record[12]='https://music.apple.com/se/album/the-wall/123';
            assert.equal(Streaming.appleMusicAlbumLink(record),record[12]);
          });

          test('streaming service loads before app and helpers leave app.js',function(){
            const html=fs.readFileSync(path.join(root,'index.html'),'utf8');
            const app=fs.readFileSync(path.join(root,'js','app.js'),'utf8');
            const servicePos=html.indexOf('/js/streaming-links.js?v=1');
            const appPos=html.indexOf('/js/app.js?v=128');
            assert.ok(servicePos>=0&&appPos>servicePos);
            assert.match(app,/var Streaming=window\\.GroovyStreaming/);
            assert.doesNotMatch(app,/function spotifyAlbumLink|function appleMusicAlbumLink/);
            assert.match(app,/Streaming\\.spotifyAlbumLink\(record\)/);
            assert.match(app,/Streaming\\.appleMusicAlbumLink\(record\)/);
          });
          `);
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check js/streaming-links.js
          node --check js/app.js
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Commit extraction and remove temporary workflow
        run: |
          rm -f .github/workflows/streaming-links-extraction.yml
          git config user.name "GroovyShelves Maintenance"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No extraction changes to commit"; exit 1; }
          git commit -m "Extract streaming link helpers from app"
          git push origin notes
