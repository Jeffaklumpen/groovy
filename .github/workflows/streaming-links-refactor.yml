name: Streaming links refactor checkpoint

on:
  push:
    branches: [notes]
    paths:
      - '.github/workflows/streaming-links-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out notes
        uses: actions/checkout@v4
        with:
          ref: notes
          fetch-depth: 0

      - name: Extract streaming URL logic
        run: |
          node <<'NODE'
          const fs=require('fs');

          function replaceExactly(path,from,to,label){
            const text=fs.readFileSync(path,'utf8');
            const matches=text.split(from).length-1;
            if(matches!==1)throw new Error(label+' expected exactly once, found '+matches);
            fs.writeFileSync(path,text.replace(from,to));
          }

          const appDependencyOld=String.raw`var Record=window.GroovyRecord;
          var Wikipedia=window.GroovyWikipedia;
          if(!Record)throw new Error('GroovyRecord must load before app.js');
          if(!Wikipedia)throw new Error('GroovyWikipedia must load before app.js');`;
          const appDependencyNew=String.raw`var Record=window.GroovyRecord;
          var Wikipedia=window.GroovyWikipedia;
          var Streaming=window.GroovyStreaming;
          if(!Record)throw new Error('GroovyRecord must load before app.js');
          if(!Wikipedia)throw new Error('GroovyWikipedia must load before app.js');
          if(!Streaming)throw new Error('GroovyStreaming must load before app.js');`;
          replaceExactly('js/app.js',appDependencyOld,appDependencyNew,'app dependency block');

          const streamingFunctionsOld=String.raw`function spotifyAlbumLink(record){
              var query=[
                  record&&Record.artist(record),
                  record&&Record.title(record)
              ].filter(Boolean).join(' ');

              return 'https://open.spotify.com/search/'+encodeURIComponent(query);
          }

          function appleMusicAlbumLink(record){
              var savedUrl=record&&Record.appleUrl(record);

              if(/^https:\/\/(?:music|itunes)\.apple\.com\//.test(String(savedUrl||''))){
                  return savedUrl;
              }

              var query=[
                  record&&Record.artist(record),
                  record&&Record.title(record)
              ].filter(Boolean).join(' ');

              return 'https://music.apple.com/se/search?term='+encodeURIComponent(query);
          }`;
          const streamingFunctionsNew=String.raw`function spotifyAlbumLink(record){
            return Streaming.spotifySearchUrl(
              record&&Record.artist(record),
              record&&Record.title(record)
            );
          }

          function appleMusicAlbumLink(record){
            return Streaming.appleMusicSearchUrl(
              record&&Record.artist(record),
              record&&Record.title(record),
              record&&Record.appleUrl(record),
              'se'
            );
          }`;
          replaceExactly('js/app.js',streamingFunctionsOld,streamingFunctionsNew,'streaming helper block');

          const scriptsOld=String.raw`<script src="/js/route-state.js?v=20"></script>
          <script src="/js/record-model.js?v=1"></script>
          <script src="/js/wikipedia-service.js?v=1"></script>
          <script src="/js/app.js?v=127"></script>`;
          const scriptsNew=String.raw`<script src="/js/route-state.js?v=20"></script>
          <script src="/js/record-model.js?v=1"></script>
          <script src="/js/streaming-links.js?v=1"></script>
          <script src="/js/wikipedia-service.js?v=1"></script>
          <script src="/js/app.js?v=128"></script>`;
          replaceExactly('index.html',scriptsOld,scriptsNew,'script loading block');

          const architectureOld='- `js/app.js` — legacy application core. It still owns most library, auth, search, shelves, marketplace and album-detail behavior and is the main target for gradual extraction.';
          const architectureNew=architectureOld+'\n- `js/streaming-links.js` — pure Spotify and Apple Music URL construction shared by feature code.';
          replaceExactly('docs/ARCHITECTURE.md',architectureOld,architectureNew,'architecture app line');

          fs.writeFileSync('js/streaming-links.js',String.raw`(function(root,factory){
            var api=factory();
            if(typeof module==='object'&&module.exports)module.exports=api;
            if(root)root.GroovyStreaming=api;
          })(typeof window!=='undefined'?window:null,function(){
            function searchQuery(artist,title){
              return [artist,title].filter(Boolean).join(' ');
            }

            function spotifySearchUrl(artist,title){
              return 'https://open.spotify.com/search/'+encodeURIComponent(searchQuery(artist,title));
            }

            function appleMusicSearchUrl(artist,title,savedUrl,storefront){
              if(/^https:\/\/(?:music|itunes)\.apple\.com\//.test(String(savedUrl||'')))return savedUrl;
              return 'https://music.apple.com/'+String(storefront||'us')+'/search?term='+encodeURIComponent(searchQuery(artist,title));
            }

            return Object.freeze({
              searchQuery:searchQuery,
              spotifySearchUrl:spotifySearchUrl,
              appleMusicSearchUrl:appleMusicSearchUrl
            });
          });
          `);

          fs.writeFileSync('tests/streaming-links.test.js',String.raw`const test=require('node:test');
          const assert=require('node:assert/strict');
          const Streaming=require('../js/streaming-links.js');

          test('builds Spotify album search URLs',()=>{
            assert.equal(
              Streaming.spotifySearchUrl('Pink Floyd','The Wall'),
              'https://open.spotify.com/search/Pink%20Floyd%20The%20Wall'
            );
          });

          test('builds Apple Music fallback URLs with the requested storefront',()=>{
            assert.equal(
              Streaming.appleMusicSearchUrl('Pink Floyd','The Wall','', 'se'),
              'https://music.apple.com/se/search?term=Pink%20Floyd%20The%20Wall'
            );
          });

          test('preserves saved Apple Music and iTunes URLs',()=>{
            const musicUrl='https://music.apple.com/se/album/the-wall/1065975633';
            const itunesUrl='https://itunes.apple.com/se/album/id1065975633';
            assert.equal(Streaming.appleMusicSearchUrl('Pink Floyd','The Wall',musicUrl,'se'),musicUrl);
            assert.equal(Streaming.appleMusicSearchUrl('Pink Floyd','The Wall',itunesUrl,'se'),itunesUrl);
          });

          test('ignores non-Apple saved URLs',()=>{
            assert.equal(
              Streaming.appleMusicSearchUrl('ABBA','The Album','https://example.com/not-apple','us'),
              'https://music.apple.com/us/search?term=ABBA%20The%20Album'
            );
          });
          `);
          NODE

      - name: Validate syntax and regression suite
        run: |
          node --check js/streaming-links.js
          node --check js/app.js
          node --test tests/*.test.js

      - name: Commit stable checkpoint
        run: |
          rm .github/workflows/streaming-links-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract app streaming link helpers"
          git push origin HEAD:notes
