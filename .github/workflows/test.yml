name: Tests

on:
  push:
    branches: [notes]
  pull_request:

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shelf controller extraction
        run: node scripts/apply-shelf-controller-extraction.js
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/shelf-controller.js
          node --check js/shelf-view.js
      - name: Run full Node regression suite
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.js 2>&1 | tee /tmp/shelf-controller-node-tests.txt
      - name: Upload Node regression output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-controller-node-tests
          path: /tmp/shelf-controller-node-tests.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Check patch whitespace
        run: git diff --check
      - name: Install browser test dependency
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests on transformed app
        env:
          GROOVY_E2E_EMAIL: ${{ secrets.GROOVY_E2E_EMAIL }}
          GROOVY_E2E_PASSWORD: ${{ secrets.GROOVY_E2E_PASSWORD }}
        run: npm run test:e2e
      - name: Commit extraction
        if: github.event_name == 'push'
        run: |
          git checkout 689fc8beef5596a64949d5dc4f3d9fff9c2fcb51 -- .github/workflows/test.yml .github/workflows/e2e.yml
          git rm scripts/apply-shelf-controller-extraction.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move shelf flow into controller"
          git push origin HEAD:notes
