name: Tests

on:
  push:
    branches: [notes]
  pull_request:

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply marketplace listing formatter extraction
        run: node scripts/apply-marketplace-listing-format-extraction.js
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/marketplace-core.js
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Commit extraction
        if: github.event_name == 'push'
        run: |
          git checkout HEAD^ -- .github/workflows/test.yml
          rm scripts/apply-marketplace-listing-format-extraction.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/marketplace-core.js tests/marketplace-core.test.js .github/workflows/test.yml scripts/apply-marketplace-listing-format-extraction.js
          git commit -m "Move marketplace listing formatters into core"
          git push origin HEAD:notes
