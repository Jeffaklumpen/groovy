name: Tests

on:
  push:
    branches: [notes]
  pull_request:

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pressing picker extraction
        run: node scripts/apply-pressing-picker-extraction.js
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/pressing-picker.js
          node --check js/pressing-view.js
      - name: Run regression tests
        run: node --test tests/*.test.js 2>&1 | tee /tmp/node-test-output.txt
      - name: Upload Node failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: /tmp/node-test-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests on transformed app
        env:
          GROOVY_E2E_EMAIL: ${{ secrets.GROOVY_E2E_EMAIL }}
          GROOVY_E2E_PASSWORD: ${{ secrets.GROOVY_E2E_PASSWORD }}
        run: npm run test:e2e
      - name: Commit extraction
        run: |
          cat > .github/workflows/test.yml <<'WORKFLOW'
          name: Tests

          on:
            push:
              branches: [notes]
            pull_request:

          permissions:
            contents: read

          jobs:
            node-tests:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Run regression tests
                  run: node --test tests/*.test.js
          WORKFLOW
          git rm scripts/apply-pressing-picker-extraction.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move pressing picker flow into controller"
          git push origin HEAD:notes
