name: Temporary Add Record patch

on:
  push:
    branches:
      - tmp/add-record-bugfixes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/add-record-bugfixes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused Add Record fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if new in text:
                  print(label + ': already applied')
                  return
              if old not in text:
                  raise SystemExit(label + ': expected source not found')
              text = text.replace(old, new, 1)
              print(label + ': applied')

          replace_once(
          """  if(error){\n    console.error('Kunde inte ta bort albumet:',error);\n    alert('Kunde inte ta bort albumet.');\n    return;\n  }\n\n  var deletedShelfId=record[13]||'';""",
          """  if(error){\n    console.error('Kunde inte ta bort albumet:',error);\n    alert('Kunde inte ta bort albumet.');\n    return;\n  }\n\n  invalidateSearchLibraryState();\n\n  var deletedShelfId=record[13]||'';""",
          'collection cache invalidation')

          replace_once(
          """  if(error||!deletedRows||!deletedRows.length){\n    console.error('Kunde inte ta bort albumet från önskelistan:',error);\n    alert('Kunde inte ta bort albumet från önskelistan.');\n    return;\n  }\n\n  await window.loadCollection();""",
          """  if(error||!deletedRows||!deletedRows.length){\n    console.error('Kunde inte ta bort albumet från önskelistan:',error);\n    alert('Kunde inte ta bort albumet från önskelistan.');\n    return;\n  }\n\n  invalidateSearchLibraryState();\n  await window.loadCollection();""",
          'wishlist cache invalidation')

          replace_once(
          """    if(deleteError)throw deleteError;\n\n    await window.loadCollection();\n    return true;""",
          """    if(deleteError)throw deleteError;\n\n    invalidateSearchLibraryState();\n    await window.loadCollection();\n    return true;""",
          'wishlist move cache invalidation')

          replace_once(
          """closeAddAlbum.addEventListener('click',function(){\n    addAlbumModal.style.display='none';\n    albumSearchInput.value='';\n    albumSearchResults.innerHTML='';\n});\n\naddAlbumModal.addEventListener('click',function(event){\n    if(event.target===addAlbumModal){\n        addAlbumModal.style.display='none';\n        albumSearchInput.value='';\n        albumSearchResults.innerHTML='';\n    }\n});""",
          """function closeAddAlbumSearch(){\n    clearTimeout(searchTimer);\n    searchTimer=null;\n    musicBrainzSearchNumber++;\n    addAlbumModal.style.display='none';\n    albumSearchInput.value='';\n    albumSearchResults.innerHTML='';\n}\n\ncloseAddAlbum.addEventListener('click',closeAddAlbumSearch);\n\naddAlbumModal.addEventListener('click',function(event){\n    if(event.target===addAlbumModal)closeAddAlbumSearch();\n});""",
          'cancel stale Add Record searches')

          path.write_text(text)
          PY

      - name: Syntax check
        run: node --check js/app.js

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Node tests
        run: npm run test:node

      - name: Commit focused patch
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No app.js changes to commit"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fix stale Add Record state"
          git push origin HEAD:tmp/add-record-bugfixes
