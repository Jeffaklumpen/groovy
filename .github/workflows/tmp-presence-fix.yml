name: Temporary presence fix

on:
  push:
    branches: [tmp/playwright-auth-readonly]

permissions:
  contents: write

jobs:
  patch-presence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/playwright-auth-readonly
      - name: Serialize realtime presence synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')

          declaration_old = "var userPresenceChannel=null;\nvar presenceUserId='';\nvar onlineUserIds=new Set();"
          declaration_new = "var userPresenceChannel=null;\nvar presenceUserId='';\nvar presenceSyncPromise=Promise.resolve();\nvar onlineUserIds=new Set();"

          function_old = """async function syncUserPresence(user){
              const nextUserId=user&&user.id?String(user.id):'';
              const nextPresenceIdentity=nextUserId||'__viewer__';
              if(nextPresenceIdentity===presenceUserId&&userPresenceChannel)return;

              const previousChannel=userPresenceChannel;
              userPresenceChannel=null;
              presenceUserId=nextPresenceIdentity;
              onlineUserIds=new Set();
              refreshUserPresenceDots();

              if(previousChannel){
                  try{await previousChannel.untrack();}catch(error){}
                  try{await supabaseClient.removeChannel(previousChannel);}catch(error){}
              }

              const channel=supabaseClient.channel('groovy-online-users',{
                  config:{presence:{key:nextUserId||anonymousPresenceKey}}
              });
              userPresenceChannel=channel;

              channel.on('presence',{event:'sync'},function(){
                  if(channel!==userPresenceChannel)return;
                  const presenceState=channel.presenceState();
                  onlineUserIds=new Set(
                      Object.keys(presenceState||{}).filter(function(key){return key.indexOf('viewer-')!==0;})
                  );
                  refreshUserPresenceDots();
              });

              channel.subscribe(async function(status){
                  if(channel!==userPresenceChannel)return;
                  if(status==='SUBSCRIBED'&&nextUserId){
                      try{
                          await channel.track({user_id:nextUserId,online_at:new Date().toISOString()});
                      }catch(error){
                          console.warn('Could not update online status:',error);
                      }
                      return;
                  }
                  if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
                      onlineUserIds=new Set();
                      refreshUserPresenceDots();
                  }
              });
          }"""

          function_new = """function syncUserPresence(user){
              presenceSyncPromise=presenceSyncPromise.then(function(){
                  return performUserPresenceSync(user);
              }).catch(function(error){
                  console.warn('Could not sync online status:',error);
              });
              return presenceSyncPromise;
          }

          async function performUserPresenceSync(user){
              const nextUserId=user&&user.id?String(user.id):'';
              const nextPresenceIdentity=nextUserId||'__viewer__';
              if(nextPresenceIdentity===presenceUserId&&userPresenceChannel)return;

              const previousChannel=userPresenceChannel;
              userPresenceChannel=null;
              presenceUserId=nextPresenceIdentity;
              onlineUserIds=new Set();
              refreshUserPresenceDots();

              if(previousChannel){
                  try{await previousChannel.untrack();}catch(error){}
                  try{await supabaseClient.removeChannel(previousChannel);}catch(error){}
              }

              const channel=supabaseClient.channel('groovy-online-users',{
                  config:{presence:{key:nextUserId||anonymousPresenceKey}}
              });
              userPresenceChannel=channel;

              channel.on('presence',{event:'sync'},function(){
                  if(channel!==userPresenceChannel)return;
                  const presenceState=channel.presenceState();
                  onlineUserIds=new Set(
                      Object.keys(presenceState||{}).filter(function(key){return key.indexOf('viewer-')!==0;})
                  );
                  refreshUserPresenceDots();
              });

              channel.subscribe(async function(status){
                  if(channel!==userPresenceChannel)return;
                  if(status==='SUBSCRIBED'&&nextUserId){
                      try{
                          await channel.track({user_id:nextUserId,online_at:new Date().toISOString()});
                      }catch(error){
                          console.warn('Could not update online status:',error);
                      }
                      return;
                  }
                  if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
                      onlineUserIds=new Set();
                      refreshUserPresenceDots();
                  }
              });
          }"""

          if declaration_old not in text:
              if declaration_new in text:
                  raise SystemExit(0)
              raise SystemExit('Presence declaration anchor not found')
          if text.count(function_old) != 1:
              raise SystemExit(f'Expected one presence function block, found {text.count(function_old)}')

          text = text.replace(declaration_old, declaration_new, 1)
          text = text.replace(function_old, function_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check js/app.js
          git diff --check
      - name: Commit focused fix
        run: |
          if git diff --quiet; then
            echo "Presence fix already applied."
            exit 0
          fi
          git config user.name "Groovy test automation"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add js/app.js
          git commit -m "Serialize realtime presence synchronization"
          git push origin HEAD:tmp/playwright-auth-readonly
