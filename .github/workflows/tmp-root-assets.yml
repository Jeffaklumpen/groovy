name: Temporary root asset cleanup

on:
  push:
    branches:
      - tmp/root-assets-cleanup

permissions:
  contents: write

jobs:
  patch-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/root-assets-cleanup
      - name: Update asset paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '/favicon.png': '/icons/favicon.png',
              '/logo.png': '/assets/images/logo.png',
              '/apple_wide.svg': '/assets/brands/apple-music-listen.svg',
              '/spotify_logo.svg': '/assets/brands/spotify-logo.svg',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected path: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "Groovyshelf"
          git config user.email "150244154+Jeffaklumpen@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update root asset paths"
            git push
          fi
