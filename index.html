<!DOCTYPE html>

<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Vinylskivor</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <h1 class="title">VINYLSKIVOR</h1>
  <div class="subtitle">50 SKIVOR</div>

<div class="header-controls">
  <button id="addAlbumButton" class="add-album-button" type="button">Add Album+</button>
  <button id="deleteModeButton" class="delete-mode-button" type="button" aria-label="Ta bort album">🗑</button>

  <div class="menu-dropdown">
    <button id="filterButton" class="menu-button" type="button" aria-expanded="false">Filter ▾</button>
    <div id="filterMenu" class="menu-panel">
      <button type="button" data-rating="all" class="active">Alla</button>
      <button type="button" data-rating="1">★ 1</button>
      <button type="button" data-rating="2">★ 2</button>
      <button type="button" data-rating="3">★ 3</button>
      <button type="button" data-rating="4">★ 4</button>
      <button type="button" data-rating="5">★ 5</button>
    </div>
  </div>

  <div class="menu-dropdown">
    <button id="viewButton" class="menu-button" type="button" aria-expanded="false">Grid ▾</button>
    <div id="viewMenu" class="menu-panel">
      <button type="button" data-view="grid" class="active">Grid</button>
      <button type="button" data-view="carousel">Carousel</button>
    </div>
  </div>
</div>
</header>

<main id="collection" class="collection"></main>

<div class="album-overlay" id="albumOverlay">
  <div class="album-detail">

<button type="button" class="album-close" id="albumClose" aria-label="Stäng">×</button>

<div class="album-detail-cover">
  <img id="detailCover" src="" alt="">
</div>

<div class="album-detail-main">
  <div class="detail-number" id="detailNumber"></div>
  <div class="detail-artist" id="detailArtist"></div>
  <div class="detail-album" id="detailAlbum"></div>

  <div class="detail-meta">
    <span id="detailYear"></span>
    <span id="detailGenre"></span>
  </div>

  <div class="detail-rating" id="detailRating"></div>
</div>

<div class="album-tracks">
  <div class="tracks-title">LÅTLISTA</div>
  <div id="detailTracks"></div>
</div>

  </div>
</div>

<div id="addAlbumModal" class="add-album-modal">

    <div class="add-album-box">

        <button id="closeAddAlbum" class="close-add-album">
            ×
        </button>

        <h2>Add Album</h2>

        <div class="add-album-search">
            <input type="text" id="albumSearchInput" placeholder="Search artist or album..." autocomplete="off">
        </div>
        <div id="albumSearchResults"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL='https://dsespqmqqeoucnglaehf.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_BiH0ijec8U1VOR46VrsP0Q_sIUL5i3U';
  const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
</script>

<div id="authBox">

    <button id="profileButton" type="button" aria-label="Profil">
        <span id="profileImage"></span>
    </button>

    <div id="profileMenu">

        <div class="profile-header">
            <div class="profile-avatar">
                <span id="profileImageMenu"></span>
            </div>

            <span id="profileUsername"></span>
        </div>

        <div class="profile-divider"></div>

        <button id="logoutButton" type="button">
            Logga ut
        </button>

    </div>

    <div id="loginPanel">
    
        <div class="login-modal">
    
            <button id="loginClose" type="button" aria-label="Stäng">×</button>
    
            <div class="login-title" id="authTitle">Logga in</div>
    
            <div id="registerFields" style="display:none;">
    
                <input id="registerUsername" type="text" placeholder="Användarnamn" autocomplete="username">
    
            </div>
    
            <input id="loginEmail" type="email" placeholder="E-post" autocomplete="email">
    
            <input id="loginPassword" type="password" placeholder="Lösenord" autocomplete="current-password">
    
            <button id="loginButton" type="button">
                Logga in
            </button>
    
            <button id="registerButton" type="button" style="display:none;">
                Skapa konto
            </button>
    
            <button id="authSwitchButton" type="button">
                Skapa konto
            </button>
    
        </div>
    
    </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
