/* =========================================================
   BAS
   ========================================================= */

*{

}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#0b0b0c;
  color:#f5f5f5;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,
              "Helvetica Neue",Arial,sans-serif;
  padding:28px;
  overflow-x:hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
  max-width:1400px;
  margin:0 auto 32px;
  border-bottom:1px solid rgba(255,255,255,.12);
  padding-bottom:20px;
  position:relative;
}

.title{
  font-size:34px;
  font-weight:600;
  letter-spacing:3px;
  margin:0;
  padding-right:250px;
}

.subtitle{
  margin-top:8px;
  color:#999;
  font-size:14px;
  letter-spacing:1px;
}

.view-toggle{
  position:absolute;
  right:0;
  top:0;
  display:table;
  padding:4px;
  background:#171719;
  border:1px solid #2b2b2e;
  border-radius:10px;
  z-index:20;
}

.view-toggle button{
  border:0;
  background:transparent;
  color:#aaa;
  padding:8px 12px;
  border-radius:7px;
  font-family:inherit;
  font-size:13px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.view-toggle button.active{
  background:#303033;
  color:#fff;
}


/* =========================================================
   COLLECTION
   ========================================================= */

.collection{
  max-width:1400px;
  margin:0 auto;
}


/* =========================================================
   GRID
   ========================================================= */

.grid:after{
  content:"";
  display:table;
  clear:both;
}

.grid .record{
  float:left;
  width:24%;
  margin-right:1.3333%;
  margin-bottom:38px;
  min-width:0;
}

.grid .record:nth-child(4n){
  margin-right:0;
}

.cover-wrapper{
  position:relative;
  width:100%;
  height:0;
  padding-bottom:100%;
  overflow:hidden;
  background:#1c1c1e;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.cover{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.number{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(0,0,0,.78);
  padding:5px 8px;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
}

.info{
  padding-top:12px;
  min-width:0;
}

.artist,
.album{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  font-size:17px;
  font-weight:600;
}

.album{
  margin-top:4px;
  font-size:15px;
  color:#c0c0c0;
}

.year{
  margin-top:5px;
  font-size:13px;
  color:#777;
}


/* =========================================================
   CAROUSEL
   ========================================================= */

.carousel{
  width:100%;
}

.carousel-viewport{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  white-space:nowrap;
  padding:42px 0 55px;
  position:relative;
  -ms-overflow-style:none;
  scrollbar-width:none;
}

.carousel-viewport::-webkit-scrollbar{
  display:none;
}

.carousel-track{
  display:inline-block;
  white-space:nowrap;
  font-size:0;
}

.carousel-card{
  display:inline-block;
  vertical-align:top;
  width:300px;
  margin:0 14px;
  white-space:normal;
  cursor:pointer;

  transform:scale(1);
  -webkit-transform:scale(1);

  transform-origin:center center;

  transition:none;
  -webkit-transition:none;

  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;

  -webkit-tap-highlight-color:transparent;
}

.carousel-card.active{
  transform:scale(1.08);
  -webkit-transform:scale(1.08);

  transition:transform .45s ease;
  -webkit-transition:-webkit-transform .45s ease;
}

.carousel-card .info{
  transition:none;
}

.carousel-card .artist{
  font-size:18px;
}

.carousel-card .album{
  font-size:15px;
}

.carousel-card .year{
  font-size:13px;
}


/* =========================================================
   ALBUM DETAIL OVERLAY
   ========================================================= */

.album-overlay{
  position:fixed;
  z-index:1000;

  left:0;
  top:0;
  right:0;
  bottom:0;

  background:rgba(0,0,0,.90);

  display:none;

  padding:28px;

  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

.album-overlay.visible{
  display:block;
}


/* =========================================================
   DETAIL PANEL
   ========================================================= */

.album-detail{
  position:relative;

  width:100%;
  max-width:1180px;

  min-height:620px;

  margin:0 auto;

  background:#111113;

  box-shadow:0 25px 70px rgba(0,0,0,.8);

  overflow:hidden;
}


/* =========================================================
   LARGE COVER
   ========================================================= */

.album-detail-cover{
  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:57%;

  overflow:hidden;

  background:#080808;
}

.album-detail-cover img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  opacity:.72;
  background:#080808;
}


/* Dark gradient over cover */

.album-detail-cover:after{
  content:"";

  position:absolute;

  left:0;
  top:0;
  right:0;
  bottom:0;

  background:
    linear-gradient(
      to right,
      rgba(0,0,0,.12) 0%,
      rgba(0,0,0,.38) 48%,
      rgba(0,0,0,.94) 100%
    );
}


/* =========================================================
   TEXT OVER COVER
   ========================================================= */

.album-detail-main{
  position:absolute;

  z-index:5;

  left:0;
  bottom:0;

  width:57%;

  padding:35px 42px 38px;

  text-shadow:0 2px 8px rgba(0,0,0,.95);
}

.detail-number{
  font-size:12px;
  color:#aaa;
  letter-spacing:2px;
  margin-bottom:9px;
}

.detail-artist{
  font-size:29px;
  font-weight:600;
  line-height:1.15;
  margin-bottom:6px;
}

.detail-album{
  font-size:22px;
  color:#ddd;
  line-height:1.2;
}

.detail-meta{
  margin-top:16px;
  color:#aaa;
  font-size:13px;
  letter-spacing:.7px;
}

.detail-meta span{
  display:inline-block;
  margin-right:17px;
}


/* =========================================================
   RATING
   ========================================================= */

.detail-rating{
  margin-top:13px;

  font-size:22px;

  letter-spacing:3px;

  color:#fff;
}

.detail-rating .empty{
  color:#555;
}


/* =========================================================
   TRACKLIST AREA
   ========================================================= */

.album-tracks{
  position:absolute;

  z-index:4;

  right:0;
  top:0;
  bottom:0;

  width:43%;

  padding:55px 38px 35px;

  background:rgba(12,12,14,.97);

  overflow:hidden;
}

.tracks-title{
  font-size:12px;

  color:#777;

  letter-spacing:2px;

  margin-bottom:22px;

  text-transform:uppercase;
}


/* =========================================================
   VINYL SIDES
   ========================================================= */

.track-side{
  margin-bottom:24px;
}

.track-side:last-child{
  margin-bottom:0;
}

.side-title{
  font-size:11px;

  font-weight:600;

  color:#aaa;

  letter-spacing:2px;

  margin-bottom:7px;

  padding-bottom:6px;

  border-bottom:
    1px solid rgba(255,255,255,.10);
}

.side-title span{
  color:#555;

  margin-right:7px;
}


/* Track list */

.tracks-list{
  margin:0;
  padding:0;

  list-style:none;

  counter-reset:track;
}

.tracks-list li{
  position:relative;

  padding:6px 0 6px 30px;

  border-bottom:
    1px solid rgba(255,255,255,.045);

  color:#d5d5d5;

  font-size:13px;

  line-height:1.25;
}

.tracks-list li:before{
  position:absolute;

  left:0;
  top:6px;

  width:21px;

  color:#555;

  counter-increment:track;

  content:counter(
    track,
    decimal-leading-zero
  );

  font-size:10px;
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.album-close{
  position:absolute;

  z-index:20;

  right:14px;
  top:12px;

  width:46px;
  height:46px;

  border:0;

  background:rgba(0,0,0,.68);

  color:#fff;

  font-size:31px;

  line-height:42px;

  text-align:center;

  border-radius:23px;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.album-close:active{
  background:rgba(255,255,255,.2);
}

    font-size:25px;
  }

  .detail-album{
    font-size:19px;
  }

  .album-tracks{

    margin-bottom:18px;
  }

  .tracks-list li{
    font-size:12px;
    padding-top:6px;
    padding-bottom:6px;
  }
}

  }

  .subtitle{
    font-size:12px;
  }

  .view-toggle{
    top:-2px;
  }

  .view-toggle button{
    padding:7px 8px;

  }

    width:48%;
    margin-right:4%;
    margin-bottom:28px;
  }

  .grid .record:nth-child(4n){
    margin-right:4%;
  }

  .grid .record:nth-child(2n){
    margin-right:0;
  }

    width:260px;
    margin-left:9px;
    margin-right:9px;
  }

  .carousel-card.active{
    transform:scale(1.07);
    -webkit-transform:scale(1.07);

    transition:transform .4s ease;
    -webkit-transition:-webkit-transform .4s ease;
  }


  /* Detail */

  .album-overlay{
    padding:10px;
  }

  .album-detail{
    min-height:0;
    height:auto;
  }

  .album-detail-cover{
    position:relative;

    width:100%;

    height:75vw;

    min-height:270px;
    max-height:430px;
  }

  .album-detail-cover:after{
    background:

        rgba(0,0,0,.10),
        rgba(0,0,0,.35) 45%,
        rgba(0,0,0,.92) 100%
      );
  }

  .album-detail-main{
    position:absolute;

    width:100%;

    left:0;
    bottom:0;

    padding:25px 22px 22px;
  }

  .detail-artist{
    font-size:22px;
  }

  .detail-album{
    font-size:17px;
  }

  .album-tracks{
    position:relative;

    width:100%;

    padding:25px 22px 30px;

    overflow:visible;
  }

  .tracks-list{
    max-height:none;
    overflow:visible;
  }

  .tracks-list li{
    font-size:13px;
  }

  .track-side{
    margin-bottom:22px;
  }
}

/* =========================================================
   VARIABLES
   ========================================================= */

var collection =
  document.getElementById('collection');

var gridButton =
  document.getElementById('gridButton');

var carouselButton =
  document.getElementById('carouselButton');

var albumOverlay =
  document.getElementById('albumOverlay');

var albumClose =
  document.getElementById('albumClose');

var detailCover =
  document.getElementById('detailCover');

var detailNumber =
  document.getElementById('detailNumber');

var detailArtist =
  document.getElementById('detailArtist');

var detailAlbum =
  document.getElementById('detailAlbum');

var detailYear =
  document.getElementById('detailYear');

var detailGenre =
  document.getElementById('detailGenre');

var detailRating =
  document.getElementById('detailRating');

var detailTracks =
  document.getElementById('detailTracks');


var view='grid';

var activeIndex=0;

var drag=false;

var startX=0;

var startY=0;

var startScroll=0;

var scrollTimer=null;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(s){

  s=String(s);

  return s
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');

}


/* =========================================================
   OPEN ALBUM
   ========================================================= */

function openAlbum(index){

  var r=records[index];

  if(!r){
    return;
  }


  /* Information */

  detailNumber.innerHTML=
    esc(r[0]);

  detailArtist.innerHTML=
    esc(r[1]);

  detailAlbum.innerHTML=
    esc(r[2]);

  detailYear.innerHTML=
    esc(r[3]);

  detailGenre.innerHTML=
    esc(r[4] || 'Genre saknas');


  /* Cover */

  detailCover.src=r[6];

  detailCover.alt=
    r[1]+' - '+r[2];


  /* Rating */

  var rating=
    parseInt(r[5],10);

  if(isNaN(rating)){
    rating=0;
  }

  if(rating<0){
    rating=0;
  }

  if(rating>5){
    rating=5;
  }


  var stars='';

  var i;


  for(i=1;i<=5;i++){

    if(i<=rating){

      stars+='★';

    }else{

      stars+=
        '<span class="empty">★</span>';

    }

  }


  detailRating.innerHTML=
    stars;


  /* =======================================================
     TRACKLIST

     Build each vinyl side separately.
     Only sides containing songs are shown.
     ======================================================= */

  var sides=
    r[7] || {};

  var sideNames=[
    'A',
    'B',
    'C',
    'D'
  ];

  var trackHTML='';

  var side;

  var tracks;

  var j;


  for(i=0;i<sideNames.length;i++){

    side=sideNames[i];

    tracks=sides[side];


    /*
      Don't show empty sides.
    */

    if(
      !tracks ||
      !tracks.length
    ){

      continue;

    }


    trackHTML+=
      '<section class="track-side">'+

        '<div class="side-title">'+
          '<span>SIDA</span>'+
          side+
        '</div>'+

        '<ol class="tracks-list">';


    for(j=0;j<tracks.length;j++){

      trackHTML+=
        '<li>'+
        esc(tracks[j])+
        '</li>';

    }


    trackHTML+=
        '</ol>'+

      '</section>';

  }


  /*
    If there is no tracklist yet.
  */

  if(!trackHTML){

    trackHTML=
      '<div style="color:#666;font-size:13px">'+
      'Ingen låtlista tillagd'+
      '</div>';

  }


  detailTracks.innerHTML=
    trackHTML;


  /* Show */

  albumOverlay.className=
    'album-overlay visible';


  /*
    Stop background scrolling.
  */

  document.body.style.overflow=
    'hidden';

}


/* =========================================================
   CLOSE ALBUM
   ========================================================= */

function closeAlbum(){

  albumOverlay.className=
    'album-overlay';

  document.body.style.overflow='';


  /*
    Release image after closing.
    Useful for old iPad memory management.
  */

  setTimeout(function(){

    if(
      albumOverlay.className.indexOf(
        'visible'
      )===-1
    ){

      detailCover.src='';

    }

  },100);

}


/* =========================================================
   ALBUM CLICK HANDLERS
   ========================================================= */

function attachAlbumClicks(){

  var elements=
    document.getElementsByClassName(
      'record'
    );

  var i;


  for(i=0;i<elements.length;i++){

    (function(index){

      elements[index].onclick=
        function(){

          /*
            In carousel don't open album
            if user is swiping.
          */

          if(
            view==='carousel' &&
            drag
          ){

            return;

          }


          openAlbum(index);

        };

    })(
      parseInt(
        elements[i].getAttribute(
          'data-index'
        ),
        10
      )
    );

  }

}


/* =========================================================
   CREATE RECORD HTML

   IMPORTANT:
   Only artist, album and year are
   displayed in the normal views.
   ========================================================= */

function recordHTML(r,cls){

  return (

    '<article class="record '+
    (cls||'')+
    '" data-index="'+
    (parseInt(r[0],10)-1)+
    '">'+

      '<div class="cover-wrapper">'+

        '<img '+
        'class="cover" '+
        'src="'+r[6]+'" '+
        'alt="'+
        esc(r[1]+' - '+r[2])+
        '">'+

        '<div class="number">'+
        r[0]+
        '</div>'+

      '</div>'+

      '<div class="info">'+

        '<div class="artist">'+
        esc(r[1])+
        '</div>'+

        '<div class="album">'+
        esc(r[2])+
        '</div>'+

        '<div class="year">'+
        esc(r[3])+
        '</div>'+

      '</div>'+

    '</article>'

  );

}


/* =========================================================
   GRID
   ========================================================= */

function buildGrid(){

  collection.className=
    'collection grid';

  var h='';

  var i;


  for(i=0;i<records.length;i++){

    h+=recordHTML(
      records[i],
      ''
    );

  }


  collection.innerHTML=h;


  attachAlbumClicks();

}


/* =========================================================
   CAROUSEL ACTIVE CARD
   ========================================================= */

function setActive(i){

  activeIndex=i;

  var cards=
    document.getElementsByClassName(
      'carousel-card'
    );

  var j;


  for(j=0;j<cards.length;j++){

    cards[j].className=
      cards[j].className
      .replace(/\sactive\b/g,'');


    if(j===i){

      cards[j].className+=
        ' active';

    }

  }

}


/* =========================================================
   CENTER CAROUSEL CARD
   ========================================================= */

function centerCard(i,smooth){

  var vp=
    document.getElementById(
      'carouselViewport'
    );

  var cards=
    document.getElementsByClassName(
      'carousel-card'
    );

  var card=cards[i];


  if(!vp || !card){

    return;

  }


  var target=
    card.offsetLeft-
    (
      vp.clientWidth-
      card.offsetWidth
    )/2;


  if(target<0){

    target=0;

  }


  var max=
    vp.scrollWidth-
    vp.clientWidth;


  if(target>max){

    target=max;

  }


  setActive(i);


  animateScroll(
    vp,
    target,
    smooth
  );

}


/* =========================================================
   SCROLL ANIMATION
   ========================================================= */

function animateScroll(
  el,
  to,
  smooth
){

  if(!smooth){

    el.scrollLeft=to;

    return;

  }


  var from=el.scrollLeft;

  var change=to-from;

  var duration=650;

  var start=
    new Date().getTime();


  function step(){

    var now=
      new Date().getTime();

    var t=
      Math.min(
        1,
        (now-start)/duration
      );

    var e=
      t*(2-t);


    el.scrollLeft=
      from+
      change*e;


    if(t<1){

      setTimeout(
        step,
        16
      );

    }

  }


  step();

}


/* =========================================================
   FIND NEAREST CAROUSEL CARD
   ========================================================= */

function nearest(){

  var vp=
    document.getElementById(
      'carouselViewport'
    );

  var cards=
    document.getElementsByClassName(
      'carousel-card'
    );


  var center=
    vp.scrollLeft+
    vp.clientWidth/2;


  var best=0;

  var dist=Infinity;

  var i;


  for(i=0;i<cards.length;i++){

    var c=cards[i];

    var cx=
      c.offsetLeft+
      c.offsetWidth/2;

    var d=
      Math.abs(
        cx-center
      );


    if(d<dist){

      dist=d;

      best=i;

    }

  }


  return best;

}


/* =========================================================
   BUILD CAROUSEL
   ========================================================= */

function buildCarousel(){

  collection.className=
    'collection carousel';


  var h=
    '<div '+
    'class="carousel-viewport" '+
    'id="carouselViewport">'+

      '<div '+
      'class="carousel-track" '+
      'id="carouselTrack">';


  var i;


  for(i=0;i<records.length;i++){

    h+=recordHTML(
      records[i],
      'carousel-card'
    );

  }


  h+=
      '</div>'+
    '</div>';


  collection.innerHTML=h;


  var vp=
    document.getElementById(
      'carouselViewport'
    );


  var cards=
    document.getElementsByClassName(
      'carousel-card'
    );


  var j;


  /*
    One tap opens album detail.

    Native horizontal scrolling remains
    available for iPad.
  */

  for(j=0;j<cards.length;j++){

    (function(index){

      cards[index].onclick=
        function(){

          if(!drag){

            openAlbum(index);

          }

        };

    })(j);

  }


  /* =======================================================
     SETTLE CAROUSEL
     ======================================================= */

  function scheduleSettle(){

    if(scrollTimer){

      clearTimeout(
        scrollTimer
      );

    }


    scrollTimer=
      setTimeout(
        function(){

          /*
            Don't touch scrollLeft while
            native momentum scrolling settles.
          */

          setActive(
            nearest()
          );

        },
        180
      );

  }


  /* =======================================================
     SCROLL
     ======================================================= */

  vp.onscroll=function(){

    setActive(-1);

    scheduleSettle();

  };


  /* =======================================================
     TOUCH START
     ======================================================= */

  vp.ontouchstart=function(e){

    if(
      !e.touches ||
      !e.touches.length
    ){

      return;

    }


    drag=false;

    startX=
      e.touches[0].pageX;

    startY=
      e.touches[0].pageY;

    startScroll=
      vp.scrollLeft;


    if(scrollTimer){

      clearTimeout(
        scrollTimer
      );

    }


    setActive(-1);

  };


  /* =======================================================
     TOUCH MOVE
     ======================================================= */

  vp.ontouchmove=function(e){

    if(
      !e.touches ||
      !e.touches.length
    ){

      return;

    }


    var dx=
      e.touches[0].pageX-
      startX;


    if(Math.abs(dx)>8){

      drag=true;

    }


    setActive(-1);

  };


  /* =======================================================
     TOUCH END
     ======================================================= */

  vp.ontouchend=function(){

    scheduleSettle();


    setTimeout(
      function(){

        drag=false;

      },
      120
    );

  };


  /*
    Center current album after switching.
  */

  setTimeout(
    function(){

      centerCard(
        activeIndex,
        false
      );

    },
    30
  );

}


/* =========================================================
   CHANGE VIEW
   ========================================================= */

function setView(next){

  view=next;


  gridButton.className=
    view==='grid'
    ? 'active'
    : '';


  carouselButton.className=
    view==='carousel'
    ? 'active'
    : '';


  gridButton.setAttribute(
    'aria-pressed',
    view==='grid'
    ? 'true'
    : 'false'
  );


  carouselButton.setAttribute(
    'aria-pressed',
    view==='carousel'
    ? 'true'
    : 'false'
  );


  if(view==='grid'){

    buildGrid();

  }else{

    buildCarousel();

  }

}


/* =========================================================
   VIEW BUTTONS
   ========================================================= */

gridButton.onclick=function(){

  setView('grid');

};


carouselButton.onclick=function(){

  setView('carousel');

};


/* =========================================================
   CLOSE
   ========================================================= */

albumClose.onclick=function(){

  closeAlbum();

};


/* =========================================================
   TAP OUTSIDE PANEL
   ========================================================= */

albumOverlay.onclick=function(e){

  e=e || window.event;


  if(e.target===albumOverlay){

    closeAlbum();

  }

};


/* =========================================================
   KEYBOARD
   ========================================================= */

document.onkeydown=function(e){

  e=e || window.event;


  /*
    ESC
  */

  if(e.keyCode===27){

    if(
      albumOverlay.className.indexOf(
        'visible'
      )!==-1
    ){

      closeAlbum();

    }

    return;

  }


  /*
    Carousel left/right
  */

  if(view!=='carousel'){

    return;

  }


  if(e.keyCode===39){

    if(
      activeIndex<
      records.length-1
    ){

      centerCard(
        activeIndex+1,
        true
      );

    }

  }


  else if(e.keyCode===37){

    if(activeIndex>0){

      centerCard(
        activeIndex-1,
        true
      );

    }

  }

};


/* =========================================================
   START
   ========================================================= */

buildGrid();


})();

</script>
