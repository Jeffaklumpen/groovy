<!DOCTYPE html>

<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Vinylskivor</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <h1 class="title">VINYLSKIVOR</h1>
  <div class="subtitle">50 SKIVOR</div>

<div class="header-controls">

  <button id="addAlbumButton" class="add-album-button" type="button">
    Add Album+
  </button>

  <div class="rating-filter">
    <button class="active" data-rating="all">Alla</button>
    <button data-rating="1">★</button>
    <button data-rating="2">★★</button>
    <button data-rating="3">★★★</button>
    <button data-rating="4">★★★★</button>
    <button data-rating="5">★★★★★</button>
  </div>

  <div class="view-toggle" role="group" aria-label="Visningsläge">
    <button id="gridButton" class="active" type="button">▦ Grid</button>
    <button id="carouselButton" type="button">◀ Karusell</button>
  </div>

</div>
</header>

<main id="collection" class="collection"></main>

<div class="album-overlay" id="albumOverlay">
  <div class="album-detail">

<button type="button" class="album-close" id="albumClose" aria-label="Stäng">×</button>

<div class="album-detail-cover">
  <img id="detailCover" src="" alt="">
</div>

<div class="album-detail-main">
  <div class="detail-number" id="detailNumber"></div>
  <div class="detail-artist" id="detailArtist"></div>
  <div class="detail-album" id="detailAlbum"></div>

  <div class="detail-meta">
    <span id="detailYear"></span>
    <span id="detailGenre"></span>
  </div>

  <div class="detail-rating" id="detailRating"></div>
    <button type="button" id="deleteAlbumButton" class="delete-album-button">
    Ta bort album
    </button>
</div>

<div class="album-tracks">
  <div class="tracks-title">LÅTLISTA</div>
  <div id="detailTracks"></div>
</div>

  </div>
</div>

<div id="addAlbumModal" class="add-album-modal">

    <div class="add-album-box">

        <button id="closeAddAlbum" class="close-add-album">
            ×
        </button>

        <h2>Add Album</h2>

        <div class="add-album-search">
            <input type="text" id="albumSearchInput" placeholder="Search artist or album..." autocomplete="off">
        </div>
        <div id="albumSearchResults"></div>

    </div>

</div>

<div id="selectionBar" class="selection-bar">
    <span id="selectionCount" class="selection-count">0 markerade</span>
    <button id="deleteSelectedButton" class="delete-selected-button" type="button">
        Ta bort markerade
    </button>
    <button id="cancelSelectionButton" class="cancel-selection-button" type="button">
        Avbryt
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL='https://dsespqmqqeoucnglaehf.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_BiH0ijec8U1VOR46VrsP0Q_sIUL5i3U';
  const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
</script>

<div id="authBox" style="position:fixed;top:10px;right:10px;z-index:9999;background:#242424;padding:12px;border-radius:8px;">
    <input id="loginEmail" type="email" placeholder="E-post">
    <input id="loginPassword" type="password" placeholder="Lösenord">
    <button id="loginButton">Logga in</button>
    <button id="logoutButton" style="display:none;">Logga ut</button>
    <span id="loginStatus" style="margin-left:8px;"></span>
</div>

<script src="js/app.js"></script>
</body>
</html>
