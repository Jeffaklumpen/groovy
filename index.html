<meta charset="UTF-8">

<title>Vinylskivor</title>

<style>
*{box-sizing:border-box}

html,body{margin:0;padding:0;min-height:100%;background:#0b0b0c;color:#f5f5f5}

body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:28px;overflow-x:hidden}

.header{max-width:1400px;margin:0 auto 32px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:20px;position:relative}

.title{font-size:34px;font-weight:600;letter-spacing:3px;margin:0;padding-right:250px}

.subtitle{margin-top:8px;color:#999;font-size:14px;letter-spacing:1px}

.view-toggle{position:absolute;right:0;top:0;display:table;padding:4px;background:#171719;border:1px solid #2b2b2e;border-radius:10px;z-index:20}

.view-toggle button{border:0;background:transparent;color:#aaa;padding:8px 12px;border-radius:7px;font-family:inherit;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}

.view-toggle button.active{background:#303033;color:#fff}

.collection{max-width:1400px;margin:0 auto}

.grid:after{content:"";display:table;clear:both}

.grid .record{float:left;width:24%;margin-right:1.3333%;margin-bottom:38px;min-width:0}

.grid .record:nth-child(4n){margin-right:0}

.cover-wrapper{position:relative;width:100%;height:0;padding-bottom:100%;overflow:hidden;background:#161618;border:1px solid #29292c;box-shadow:0 8px 12px rgba(0,0,0,.28),0 18px 35px rgba(0,0,0,.48),0 2px 3px rgba(0,0,0,.55);-webkit-transform:translateZ(0);transform:translateZ(0)}

.cover{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}

.grid .record{transition:transform .18s ease;-webkit-transition:-webkit-transform .18s ease}
.grid .record:active{-webkit-transform:scale(.985);transform:scale(.985)}

.number{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.78);padding:5px 8px;font-size:13px;font-weight:bold;letter-spacing:1px}

.cover-rating{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.78);padding:5px 8px;font-size:15px;letter-spacing:2px;color:#fff;line-height:1}
.cover-rating .empty{color:#555}

.info{padding-top:12px;min-width:0}

.artist,.album{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.artist{font-size:17px;font-weight:600}

.album{margin-top:4px;font-size:15px;color:#c0c0c0}

.year{margin-top:5px;font-size:13px;color:#777}

.carousel{width:100%}

.carousel-viewport{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;white-space:nowrap;padding:42px 0 55px;position:relative;-ms-overflow-style:none;scrollbar-width:none}

.carousel-viewport::-webkit-scrollbar{display:none}

.carousel-track{display:inline-block;white-space:nowrap;font-size:0}

.carousel-card{display:inline-block;vertical-align:top;width:300px;margin:0 14px;white-space:normal;cursor:pointer;transform:scale(1);-webkit-transform:scale(1);transform-origin:center center;transition:none;-webkit-transition:none;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-tap-highlight-color:transparent}
.carousel-card .cover-wrapper{box-shadow:0 7px 10px rgba(0,0,0,.25),0 18px 32px rgba(0,0,0,.52),0 28px 48px rgba(0,0,0,.25);border:1px solid #2d2d30}
.carousel-card.active .cover-wrapper{box-shadow:0 9px 12px rgba(0,0,0,.30),0 22px 42px rgba(0,0,0,.62),0 32px 55px rgba(0,0,0,.28)}

.carousel-card.active{transform:scale(1.08);-webkit-transform:scale(1.08);transition:transform .45s ease;-webkit-transition:-webkit-transform .45s ease}

.carousel-card .info{transition:none}
.carousel-card .artist{font-size:18px}
.carousel-card .album{font-size:15px}
.carousel-card .year{font-size:13px}

.album-overlay{position:fixed;z-index:1000;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0);display:block;padding:28px;overflow:auto;-webkit-overflow-scrolling:touch;visibility:hidden;opacity:0;-webkit-transition:opacity .28s ease,visibility 0s linear .32s;transition:opacity .28s ease,visibility 0s linear .32s}
.album-overlay.visible{visibility:visible;opacity:1;background:rgba(0,0,0,.90);-webkit-transition:opacity .28s ease,visibility 0s linear 0s;transition:opacity .28s ease,visibility 0s linear 0s}

.album-detail{position:relative;width:100%;max-width:1180px;min-height:620px;margin:0 auto;background:#111113;box-shadow:0 25px 70px rgba(0,0,0,.8);overflow:hidden;-webkit-transform:scale(.88);transform:scale(.88);opacity:0;-webkit-transition:-webkit-transform .32s cubic-bezier(.2,.8,.2,1),opacity .22s ease;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .22s ease}
.album-overlay.visible .album-detail{-webkit-transform:scale(1);transform:scale(1);opacity:1}

.album-detail-cover{position:absolute;left:0;top:0;width:620px;height:620px;overflow:hidden;background:#080808}

.album-detail-cover img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;opacity:1}

.album-detail-main:before{content:"";position:absolute;z-index:-1;left:-40px;right:0;top:-200px;bottom:-15px;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.45) 30%,rgba(0,0,0,.85) 60%,rgba(0,0,0,.95) 100%);pointer-events:none}
  
.album-detail-main{position:absolute;z-index:5;left:0;bottom:0;width:620px;padding:35px 42px 38px;text-shadow:0 2px 8px rgba(0,0,0,.95)}

.detail-number{font-size:12px;color:#aaa;letter-spacing:2px;margin-bottom:9px}

.detail-artist{font-size:29px;font-weight:600;line-height:1.15;margin-bottom:6px}

.detail-album{font-size:22px;color:#ddd;line-height:1.2}

.detail-meta{margin-top:16px;color:#aaa;font-size:13px;letter-spacing:.7px}

.detail-meta span{display:inline-block;margin-right:17px}

.detail-rating{margin-top:13px;font-size:22px;letter-spacing:3px;color:#fff}

.detail-rating .empty{color:#555}

.album-tracks{position:absolute;z-index:4;right:0;top:0;bottom:0;width:calc(100% - 620px);padding:55px 38px 35px;background:rgba(12,12,14,.97);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;-webkit-transform:translateZ(0);transform:translateZ(0)}

.tracks-title{font-size:12px;color:#777;letter-spacing:2px;margin-bottom:22px;text-transform:uppercase}

.track-side{margin-bottom:24px}

.track-side:last-child{margin-bottom:0}

.side-title{font-size:11px;font-weight:600;color:#aaa;letter-spacing:2px;margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.10)}

.side-title span{color:#555;margin-right:7px}

.tracks-list{margin:0;padding:0;list-style:none;counter-reset:track}

.tracks-list li{position:relative;padding:6px 0 6px 30px;border-bottom:1px solid rgba(255,255,255,.045);color:#d5d5d5;font-size:13px;line-height:1.25}

.tracks-list li:before{position:absolute;left:0;top:6px;width:21px;color:#555;counter-increment:track;content:counter(track,decimal-leading-zero);font-size:10px}

.track-rating{position:absolute;right:0;top:6px;color:#fff;font-size:13px;letter-spacing:1px;white-space:nowrap}
.track-rating .empty{color:#555}
.track-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:75px}

.album-close{position:absolute;z-index:20;right:14px;top:12px;width:46px;height:46px;border:0;background:rgba(0,0,0,.68);color:#fff;font-size:31px;line-height:42px;text-align:center;border-radius:23px;cursor:pointer;-webkit-tap-highlight-color:transparent}

.album-close:active{background:rgba(255,255,255,.2)}

.rating-filter{position:absolute;right:230px;top:0;display:table;padding:4px;background:#171719;border:1px solid #2b2b2e;border-radius:10px;z-index:20}
.rating-filter button{border:0;background:transparent;color:#aaa;padding:8px 10px;border-radius:7px;font-family:inherit;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rating-filter button.active{background:#303033;color:#fff}

@media screen and (min-width:601px) and (max-width:1100px){
body{padding:20px}
.header{margin-bottom:24px}
.title{font-size:28px}
.grid .record{width:24%;margin-right:1.3333%;margin-bottom:30px}
.grid .artist{font-size:15px}
.grid .album{font-size:13px}
.grid .year{font-size:12px}
.carousel-viewport{padding-top:32px;padding-bottom:58px}
.carousel-card{width:300px;margin-left:12px;margin-right:12px}
.carousel-card.active{transform:scale(1.10);-webkit-transform:scale(1.10);transition:transform .45s ease;-webkit-transition:-webkit-transform .45s ease}
.carousel-card .artist{font-size:16px}
.carousel-card .album{font-size:14px}
.album-overlay{padding:20px}
.album-detail{min-height:620px}
.album-detail-main{padding:28px 30px 30px}
.detail-artist{font-size:25px}
.detail-album{font-size:19px}
.album-tracks{padding:50px 28px 25px}
.track-side{margin-bottom:18px}
.tracks-list li{font-size:12px;padding-top:6px;padding-bottom:6px}
}

@media screen and (max-width:600px){
body{padding:15px}
.header{padding-bottom:16px;margin-bottom:20px}
.title{font-size:23px;padding-right:175px;letter-spacing:2px}
.subtitle{font-size:12px}
.view-toggle{top:-2px}
.view-toggle button{padding:7px 8px;font-size:12px}
.grid .record{width:48%;margin-right:4%;margin-bottom:28px}
.grid .record:nth-child(4n){margin-right:4%}
.grid .record:nth-child(2n){margin-right:0}
.carousel-card{width:260px;margin-left:9px;margin-right:9px}
.carousel-card.active{transform:scale(1.07);-webkit-transform:scale(1.07);transition:transform .4s ease;-webkit-transition:-webkit-transform .4s ease}
.album-overlay{padding:10px}
.album-detail{min-height:0;height:auto}
.album-detail-cover{position:relative;width:100%;height:75vw;min-height:270px;max-height:430px}
.album-detail-cover:after{background:linear-gradient(to bottom,rgba(0,0,0,.10),rgba(0,0,0,.35) 45%,rgba(0,0,0,.92) 100%)}
.album-detail-main{position:absolute;width:100%;left:0;bottom:0;padding:25px 22px 22px}
.detail-artist{font-size:22px}
.detail-album{font-size:17px}
.album-tracks{position:relative;width:100%;padding:25px 22px 30px;overflow:visible}
.tracks-list{max-height:none;overflow:visible}
.tracks-list li{font-size:13px}
.track-side{margin-bottom:22px}
}
</style>

</head>

var collection=document.getElementById('collection');
var gridButton=document.getElementById('gridButton');
var carouselButton=document.getElementById('carouselButton');
var albumOverlay=document.getElementById('albumOverlay');
var albumClose=document.getElementById('albumClose');
var detailCover=document.getElementById('detailCover');
var detailNumber=document.getElementById('detailNumber');
var detailArtist=document.getElementById('detailArtist');
var detailAlbum=document.getElementById('detailAlbum');
var detailYear=document.getElementById('detailYear');
var detailGenre=document.getElementById('detailGenre');
var detailRating=document.getElementById('detailRating');
var detailTracks=document.getElementById('detailTracks');

var view='grid';
var activeIndex=0;
var drag=false;
var startX=0;
var startY=0;
var startScroll=0;
var scrollTimer=null;

function esc(value){
  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function recordHTML(record, className){
  var html='<article class="record '+(className||'')+'" data-index="'+(parseInt(record[0],10)-1)+'">'+
    '<div class="cover-wrapper">'+
      '<img class="cover" src="" data-src="'+record[6]+'" alt="'+esc(record[1]+' - '+record[2])+'">'+
      '<div class="number">'+record[0]+'</div>'+
      '<div class="cover-rating">';

  for(var r=1;r<=5;r++){
    html+=r<=record[5]?'★':'<span class="empty">★</span>';
  }

  html+='</div>'+
    '</div>'+
    '<div class="info">'+
      '<div class="artist">'+esc(record[1])+'</div>'+
      '<div class="album">'+esc(record[2])+'</div>'+
      '<div class="year">'+esc(record[3])+'</div>'+
    '</div>'+
  '</article>';

  return html;
}

function loadVisibleImages(){
  var images=document.querySelectorAll('.cover');
  var height=window.innerHeight||600;

  for(var i=0;i<images.length;i++){
    var img=images[i];
    var dataSrc=img.getAttribute('data-src');

    if(!dataSrc)continue;

    var rect=img.getBoundingClientRect();

    if(rect.top<height+500&&rect.bottom>-500){
      img.setAttribute('src',dataSrc);
      img.removeAttribute('data-src');
    }
  }
}

function openAlbum(index){
  var record=records[index];
  if(!record)return;

  detailNumber.innerHTML=esc(record[0]);
  detailArtist.innerHTML=esc(record[1]);
  detailAlbum.innerHTML=esc(record[2]);
  detailYear.innerHTML=esc(record[3]);
  detailGenre.innerHTML=esc(record[4]||'Genre saknas');

  detailCover.src=record[6];
  detailCover.alt=record[1]+' - '+record[2];

  var rating=parseInt(record[5],10);
  if(isNaN(rating))rating=0;
  rating=Math.max(0,Math.min(5,rating));

  var stars='';
  for(var i=1;i<=5;i++){
    stars+=i<=rating?'★':'<span class="empty">★</span>';
  }
  detailRating.innerHTML=stars;

  var sides=record[7]||{};
  var sideNames=['A','B','C','D'];
  var html='';

  for(i=0;i<sideNames.length;i++){
    var side=sideNames[i];
    var tracks=sides[side];

    if(!tracks||!tracks.length)continue;

    html+='<section class="track-side">'+
      '<div class="side-title"><span>SIDA</span>'+side+'</div>'+
      '<ol class="tracks-list">';

  for(var j=0;j<tracks.length;j++){
    var track=String(tracks[j]);
    var parts=track.split('|');
    var title=parts[0];
    var rating=parseInt(parts[1],10);
  
    if(isNaN(rating))rating=0;
    rating=Math.max(0,Math.min(5,rating));
  
    var trackStars='';
    for(var s=1;s<=5;s++){
      trackStars+=s<=rating?'★':'<span class="empty">☆</span>';
    }
  
    html+='<li><span class="track-title">'+esc(title)+'</span><span class="track-rating">'+trackStars+'</span></li>';
  }

    html+='</ol></section>';
  }

  detailTracks.innerHTML=html||
    '<div style="color:#666;font-size:13px">Ingen låtlista tillagd</div>';

  albumOverlay.className='album-overlay visible';
  document.body.style.overflow='hidden';
}

function closeAlbum(){
  albumOverlay.className='album-overlay';
  document.body.style.overflow='';

  setTimeout(function(){
    if(albumOverlay.className.indexOf('visible')===-1){
      detailCover.src='';
    }
  },350);
}


function attachAlbumClicks(){
  var elements=document.getElementsByClassName('record');

  for(var i=0;i<elements.length;i++){
    (function(index){
      elements[index].onclick=function(){
        if(view==='carousel'&&drag)return;
        openAlbum(index);
      };
    })(parseInt(elements[i].getAttribute('data-index'),10));
  }
}

function buildGrid(){
  collection.className='collection grid';

  var html='';
  for(var i=0;i<records.length;i++){
    html+=recordHTML(records[i],'');
  }

  collection.innerHTML=html;
  attachAlbumClicks();
  loadVisibleImages();
}

function setActive(index){
  activeIndex=index;

  var cards=document.getElementsByClassName('carousel-card');

  for(var i=0;i<cards.length;i++){
    cards[i].className=cards[i].className.replace(/\sactive\b/g,'');

    if(i===index){
      cards[i].className+=' active';
    }
  }
}

function animateScroll(element,to,smooth){
  if(!smooth){
    element.scrollLeft=to;
    return;
  }

  var from=element.scrollLeft;
  var change=to-from;
  var duration=650;
  var start=new Date().getTime();

  function step(){
    var time=new Date().getTime();
    var progress=Math.min(1,(time-start)/duration);
    var easing=progress*(2-progress);

    element.scrollLeft=from+change*easing;

    if(progress<1){
      setTimeout(step,16);
    }
  }

  step();
}

function centerCard(index,smooth){
  var viewport=document.getElementById('carouselViewport');
  var cards=document.getElementsByClassName('carousel-card');
  var card=cards[index];

  if(!viewport||!card)return;

  var target=card.offsetLeft-(viewport.clientWidth-card.offsetWidth)/2;
  var max=viewport.scrollWidth-viewport.clientWidth;

  target=Math.max(0,Math.min(target,max));

  setActive(index);
  animateScroll(viewport,target,smooth);
}

function nearest(){
  var viewport=document.getElementById('carouselViewport');
  var cards=document.getElementsByClassName('carousel-card');
  var center=viewport.scrollLeft+viewport.clientWidth/2;

  var best=0;
  var distance=Infinity;

  for(var i=0;i<cards.length;i++){
    var card=cards[i];
    var cardCenter=card.offsetLeft+card.offsetWidth/2;
    var currentDistance=Math.abs(cardCenter-center);

    if(currentDistance<distance){
      distance=currentDistance;
      best=i;
    }
  }

  return best;
}

function buildCarousel(){
  collection.className='collection carousel';

  var html=
    '<div class="carousel-viewport" id="carouselViewport">'+
      '<div class="carousel-track" id="carouselTrack">';

  for(var i=0;i<records.length;i++){
    html+=recordHTML(records[i],'carousel-card');
  }

  html+='</div></div>';
  collection.innerHTML=html;
  loadVisibleImages();
  
  var viewport=document.getElementById('carouselViewport');
  var cards=document.getElementsByClassName('carousel-card');

  for(var j=0;j<cards.length;j++){
    (function(index){
      cards[index].onclick=function(){
        if(!drag)openAlbum(index);
      };
    })(j);
  }

  function scheduleSettle(){
    if(scrollTimer)clearTimeout(scrollTimer);

    scrollTimer=setTimeout(function(){
      setActive(nearest());
    },180);
  }

  viewport.onscroll=function(){
    setActive(-1);
    scheduleSettle();
  };

  viewport.ontouchstart=function(event){
    if(!event.touches||!event.touches.length)return;

    drag=false;
    startX=event.touches[0].pageX;
    startY=event.touches[0].pageY;
    startScroll=viewport.scrollLeft;

    if(scrollTimer)clearTimeout(scrollTimer);
    setActive(-1);
  };

  viewport.ontouchmove=function(event){
    if(!event.touches||!event.touches.length)return;

    var dx=event.touches[0].pageX-startX;

    if(Math.abs(dx)>8)drag=true;

    setActive(-1);
  };

  viewport.ontouchend=function(){
    scheduleSettle();

    setTimeout(function(){
      drag=false;
    },120);
  };

  setTimeout(function(){
    centerCard(activeIndex,false);
  },30);
}

function setView(nextView){
  view=nextView;

  gridButton.className=view==='grid'?'active':'';
  carouselButton.className=view==='carousel'?'active':'';

  gridButton.setAttribute('aria-pressed',view==='grid'?'true':'false');
  carouselButton.setAttribute('aria-pressed',view==='carousel'?'true':'false');

  if(view==='grid'){
    buildGrid();
  }else{
    buildCarousel();
  }
}

gridButton.onclick=function(){
  setView('grid');
};

carouselButton.onclick=function(){
  setView('carousel');
};

albumClose.onclick=function(){
  closeAlbum();
};

albumOverlay.onclick=function(event){
  if((event||window.event).target===albumOverlay){
    closeAlbum();
  }
};

document.onkeydown=function(event){
  event=event||window.event;

  if(event.keyCode===27){
    if(albumOverlay.className.indexOf('visible')!==-1){
      closeAlbum();
    }
    return;
  }

  if(view!=='carousel')return;

  if(event.keyCode===39&&activeIndex<records.length-1){
    centerCard(activeIndex+1,true);
  }else if(event.keyCode===37&&activeIndex>0){
    centerCard(activeIndex-1,true);
  }
};

var ratingFilter=document.querySelectorAll('.rating-filter button');

for(var f=0;f<ratingFilter.length;f++){
  ratingFilter[f].onclick=function(){
    var selected=this.getAttribute('data-rating');

    for(var i=0;i<ratingFilter.length;i++){
      ratingFilter[i].className='';
    }

    this.className='active';

    var visibleRecords=document.querySelectorAll('.record');

    for(var r=0;r<visibleRecords.length;r++){
      var index=parseInt(visibleRecords[r].getAttribute('data-index'),10);
      var rating=parseInt(records[index][5],10);

      if(selected==='all'||rating===parseInt(selected,10)){
        visibleRecords[r].style.display='';
      }else{
        visibleRecords[r].style.display='none';
      }
    }
  };
}

window.onscroll=function(){
  loadVisibleImages();
};

buildGrid();

})();
