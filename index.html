<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Collection</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
        }

        .collection {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .record {
            display: table-cell;
            padding: 8px;
            vertical-align: top;
            text-align: center;
        }

        .cover {
            width: 100%;
            max-width: 180px;
            height: auto;
            background: #333;
            margin: 0 auto 8px auto;
        }

        .number {
            font-size: 20px;
            font-weight: bold;
        }

        .artist {
            font-size: 16px;
            font-weight: bold;
        }

        .album {
            font-size: 15px;
        }

        .year {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>

<h1>MY VINYL COLLECTION</h1>

<div class="collection">

    <div class="record">
        <div class="cover">COVER</div>
        <div class="number">01</div>
        <div class="artist">David Bowie</div>
        <div class="album">Hunky Dory</div>
        <div class="year">1971</div>
    </div>

    <div class="record">
        <div class="cover">COVER</div>
        <div class="number">02</div>
        <div class="artist">Pink Floyd</div>
        <div class="album">Meddle</div>
        <div class="year">1971</div>
    </div>

    <div class="record">
        <div class="cover">COVER</div>
        <div class="number">03</div>
        <div class="artist">Kraftwerk</div>
        <div class="album">Trans-Europe Express</div>
        <div class="year">1977</div>
    </div>

    <div class="record">
        <div class="cover">COVER</div>
        <div class="number">04</div>
        <div class="artist">The Beatles</div>
        <div class="album">Abbey Road</div>
        <div class="year">1969</div>
    </div>

</div>

</body>
</html>
